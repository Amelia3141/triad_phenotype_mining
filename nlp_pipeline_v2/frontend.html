<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Case Report Phenotyping Pipeline</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #242836;
    --border: #2e3345;
    --text: #e2e4eb;
    --text-dim: #8b8fa3;
    --accent: #6c8cff;
    --accent-dim: #4a5fa0;
    --green: #4ade80;
    --yellow: #facc15;
    --red: #f87171;
    --orange: #fb923c;
    --font: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
    --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    font-size: 14px;
    line-height: 1.6;
    min-height: 100vh;
  }

  .app-container {
    display: grid;
    grid-template-columns: 360px 1fr;
    grid-template-rows: auto 1fr;
    height: 100vh;
    gap: 0;
  }

  .header {
    grid-column: 1 / -1;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .header h1 {
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.3px;
  }

  .header .subtitle {
    color: var(--text-dim);
    font-size: 12px;
  }

  .status-badge {
    margin-left: auto;
    padding: 4px 12px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .status-idle { background: var(--surface2); color: var(--text-dim); }
  .status-running { background: #1e3a5f; color: var(--accent); animation: pulse 2s infinite; }
  .status-done { background: #1a3d2e; color: var(--green); }
  .status-error { background: #3d1a1a; color: var(--red); }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }

  /* Left panel */
  .control-panel {
    background: var(--surface);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .panel-section {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
  }

  .panel-section h3 {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-dim);
    margin-bottom: 10px;
  }

  .step-number {
    display: inline-flex;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--accent-dim);
    color: white;
    font-size: 11px;
    font-weight: 700;
    align-items: center;
    justify-content: center;
    margin-right: 6px;
  }

  .step-number.done { background: var(--green); }
  .step-number.active { background: var(--accent); animation: pulse 2s infinite; }

  label {
    display: block;
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 4px;
    font-weight: 500;
  }

  input, textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    padding: 8px 10px;
    font-size: 13px;
    font-family: var(--font-sans);
    outline: none;
    transition: border-color 0.2s;
  }

  input:focus, textarea:focus {
    border-color: var(--accent);
  }

  textarea {
    resize: vertical;
    min-height: 60px;
    font-family: var(--font);
    font-size: 12px;
  }

  .hint {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 3px;
    font-style: italic;
  }

  .checkbox-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px 14px;
    margin-top: 4px;
  }
  .checkbox-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text);
    cursor: pointer;
    font-weight: 500;
  }
  .checkbox-item input {
    width: auto;
    margin: 0;
    cursor: pointer;
  }

  .files-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .files-header .section-title {
    border-bottom: none;
    margin: 16px 0 10px;
    padding-bottom: 0;
  }
  a.download-all-btn {
    display: inline-block;
    width: auto;
    padding: 8px 14px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
    background: var(--accent);
    color: white;
    white-space: nowrap;
  }
  a.download-all-btn:hover {
    background: #7d9bff;
  }

  button {
    width: 100%;
    padding: 8px 14px;
    border: none;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    font-family: var(--font-sans);
  }

  button.primary {
    background: var(--accent);
    color: white;
  }
  button.primary:hover:not(:disabled) {
    background: #7d9bff;
  }
  button.primary:disabled {
    background: var(--accent-dim);
    opacity: 0.5;
    cursor: not-allowed;
  }

  button.secondary {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
  }
  button.secondary:hover:not(:disabled) {
    background: var(--border);
  }

  .input-group {
    margin-bottom: 10px;
  }

  /* Right panel: log + results */
  .main-panel {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .tab-bar {
    display: flex;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 16px;
  }

  .tab {
    padding: 10px 16px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-dim);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.15s;
  }

  .tab:hover { color: var(--text); }
  .tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  .tab-content {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
  }

  /* Log view */
  .log-container {
    font-family: var(--font);
    font-size: 12px;
    line-height: 1.7;
  }

  .log-line {
    padding: 1px 0;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .log-line .time {
    color: var(--text-dim);
    margin-right: 8px;
    user-select: none;
  }

  .log-line.info .msg { color: var(--text); }
  .log-line.success .msg { color: var(--green); }
  .log-line.warn .msg { color: var(--yellow); }
  .log-line.error .msg { color: var(--red); }
  .log-line.log .msg { color: var(--text-dim); font-size: 11px; }

  /* Results view */
  .results-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }

  .stat-card {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
  }

  .stat-card .stat-label {
    font-size: 11px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
  }

  .stat-card .stat-value {
    font-size: 24px;
    font-weight: 700;
    color: var(--accent);
  }

  .stat-card .stat-detail {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 4px;
  }

  .bar-chart {
    margin-top: 16px;
  }

  .bar-row {
    display: flex;
    align-items: center;
    margin-bottom: 4px;
    font-size: 12px;
  }

  .bar-label {
    width: 200px;
    color: var(--text-dim);
    text-overflow: ellipsis;
    overflow: hidden;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .bar-track {
    flex: 1;
    height: 16px;
    background: var(--bg);
    border-radius: 3px;
    margin: 0 8px;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 3px;
    transition: width 0.5s ease;
  }

  .bar-count {
    width: 40px;
    text-align: right;
    color: var(--text);
    font-family: var(--font);
    font-size: 11px;
    flex-shrink: 0;
  }

  .section-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    margin: 20px 0 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }

  .file-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .file-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 12px;
  }

  .file-item .fname {
    font-family: var(--font);
    color: var(--text);
  }

  .file-item .fsize {
    color: var(--text-dim);
    font-family: var(--font);
    font-size: 11px;
  }

  .file-item a {
    color: var(--accent);
    text-decoration: none;
    font-weight: 600;
    font-size: 11px;
  }

  .file-item a:hover { text-decoration: underline; }

  .empty-state {
    text-align: center;
    color: var(--text-dim);
    padding: 60px 20px;
    font-size: 13px;
  }

  .empty-state .icon { font-size: 40px; margin-bottom: 12px; opacity: 0.4; }

  .pmc-preview {
    max-height: 200px;
    overflow-y: auto;
    font-size: 11px;
    margin-top: 8px;
  }

  .pmc-preview-item {
    padding: 4px 0;
    border-bottom: 1px solid var(--border);
    color: var(--text-dim);
  }

  .pmc-preview-item .pmc-title {
    color: var(--text);
    font-weight: 500;
  }

  .slider-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .slider-row input[type="range"] {
    flex: 1;
    padding: 0;
    height: auto;
    background: transparent;
    border: none;
  }

  .slider-val {
    font-family: var(--font);
    font-size: 12px;
    color: var(--accent);
    min-width: 40px;
    text-align: right;
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

function App() {
  const [status, setStatus] = useState('idle');
  const [progress, setProgress] = useState('');
  const [logs, setLogs] = useState([]);
  const [activeTab, setActiveTab] = useState('log');

  // Form state
  const [diseases, setDiseases] = useState('');
  const [comorbidities, setComorbidities] = useState('');
  const [pmcQuery, setPmcQuery] = useState('');
  const [maxArticles, setMaxArticles] = useState(50);
  const [maxDownload, setMaxDownload] = useState(50);

  // Publication-type filter (PMC). Case reports ticked by default since the
  // extraction pipeline targets individual-patient case reports.
  const PUB_TYPE_OPTIONS = [
    { id: 'case_reports', label: 'Case reports' },
    { id: 'review', label: 'Reviews' },
    { id: 'systematic_review', label: 'Systematic reviews' },
    { id: 'clinical_trial', label: 'Clinical trials' },
    { id: 'meta_analysis', label: 'Meta-analyses' },
    { id: 'observational', label: 'Observational studies' },
    { id: 'comparative_study', label: 'Comparative studies' },
  ];
  const [pubTypes, setPubTypes] = useState({ case_reports: true });
  const togglePubType = (id) =>
    setPubTypes(prev => ({ ...prev, [id]: !prev[id] }));

  // LLM enhancement state
  const [enableLLM, setEnableLLM] = useState(false);
  const [llmProvider, setLlmProvider] = useState('anthropic');
  const [llmModel, setLlmModel] = useState('');
  const [llmApiKey, setLlmApiKey] = useState('');

  // Pipeline state
  const [configReady, setConfigReady] = useState(false);
  const [pmcResults, setPmcResults] = useState(null);
  const [articlesCount, setArticlesCount] = useState(0);
  const [results, setResults] = useState(null);
  const [outputFiles, setOutputFiles] = useState([]);
  const [corrections, setCorrections] = useState([]);

  const logEndRef = useRef(null);
  const eventSourceRef = useRef(null);

  // SSE connection
  useEffect(() => {
    const es = new EventSource('/api/stream-logs');
    es.onmessage = (event) => {
      try {
        const msg = JSON.parse(event.data);
        setLogs(prev => [...prev, msg]);
      } catch (e) {}
    };
    eventSourceRef.current = es;
    return () => es.close();
  }, []);

  // Auto-scroll log
  useEffect(() => {
    if (logEndRef.current && activeTab === 'log') {
      logEndRef.current.scrollIntoView({ behavior: 'smooth' });
    }
  }, [logs, activeTab]);

  // Poll status
  useEffect(() => {
    const interval = setInterval(async () => {
      try {
        const r = await fetch('/api/status');
        const data = await r.json();
        setStatus(data.status);
        setProgress(data.progress);
        setConfigReady(data.config_ready);
        setArticlesCount(data.articles_count);
      } catch (e) {}
    }, 1500);
    return () => clearInterval(interval);
  }, []);

  const isRunning = status === 'running';

  // Actions
  const generateConfig = async () => {
    const diseaseList = diseases.split('\n').map(s => s.trim()).filter(Boolean);
    const comorbList = comorbidities.split('\n').map(s => s.trim()).filter(Boolean);
    if (!diseaseList.length) return;

    setLogs([]);
    setActiveTab('log');
    await fetch('/api/generate-config', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ diseases: diseaseList, comorbidities: comorbList }),
    });

    // Auto-generate PMC query: use raw names immediately, then upgrade with
    // MONDO synonyms once the config finishes generating
    if (!pmcQuery) {
      const q = diseaseList.map(d => `"${d}"`).join(' OR ');
      setPmcQuery(`(${q})`);
    }
    // Poll for config readiness and update query with synonyms
    const pollForSynonyms = setInterval(async () => {
      try {
        const r = await fetch('/api/status');
        const s = await r.json();
        if (s.config_ready && s.search_terms && s.search_terms.length > 0) {
          clearInterval(pollForSynonyms);
          const q = s.search_terms.map(t => `"${t}"`).join(' OR ');
          setPmcQuery(`(${q})`);
        }
        if (s.status === 'error') clearInterval(pollForSynonyms);
      } catch(e) { clearInterval(pollForSynonyms); }
    }, 2000);
  };

  const searchPMC = async () => {
    if (!pmcQuery.trim()) return;
    setActiveTab('log');
    const selectedPubTypes = Object.keys(pubTypes).filter(k => pubTypes[k]);
    await fetch('/api/search-pmc', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query: pmcQuery, max_results: maxArticles, pub_types: selectedPubTypes }),
    });

    // Poll for results
    setTimeout(async () => {
      const r = await fetch('/api/pmc-results');
      const data = await r.json();
      setPmcResults(data);
    }, 3000);
  };

  const downloadArticles = async () => {
    setActiveTab('log');
    await fetch(`/api/download-articles?max_articles=${maxDownload}`, { method: 'POST' });
  };

  const runPipeline = async () => {
    setActiveTab('log');
    setResults(null);
    await fetch('/api/run-pipeline', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        enable_llm: enableLLM,
        llm_provider: llmProvider,
        llm_model: llmModel,
        llm_api_key: llmApiKey,
      }),
    });

    // Poll for results when done
    const poll = setInterval(async () => {
      try {
        const sr = await fetch('/api/status');
        const sd = await sr.json();
        if (sd.status === 'done') {
          clearInterval(poll);
          const rr = await fetch('/api/results');
          setResults(await rr.json());
          const fr = await fetch('/api/output-files');
          setOutputFiles((await fr.json()).files);
          setActiveTab('results');
        }
      } catch (e) {}
    }, 2000);
  };

  const clearLogs = () => setLogs([]);

  const loadCorrections = async () => {
    try {
      const r = await fetch('/api/corrections');
      const data = await r.json();
      setCorrections(data.corrections || []);
    } catch (e) {}
  };

  const stepState = (step) => {
    if (step === 1 && configReady) return 'done';
    if (step === 2 && pmcResults?.total > 0) return 'done';
    if (step === 3 && articlesCount > 0) return 'done';
    if (step === 4 && results?.count > 0) return 'done';
    return '';
  };

  return (
    <div className="app-container">
      <div className="header">
        <h1>Case Report Phenotyping Pipeline</h1>
        <span className="subtitle">Hybrid NLP extraction from PMC case reports</span>
        <span className={`status-badge status-${status}`}>
          {status === 'running' ? progress : status}
        </span>
      </div>

      {/* Left: Controls */}
      <div className="control-panel">

        {/* Step 1: Config */}
        <div className="panel-section">
          <h3>
            <span className={`step-number ${stepState(1)} ${isRunning && !configReady ? 'active' : ''}`}>1</span>
            Disease Configuration
          </h3>
          <div className="input-group">
            <label>Diseases (one per line)</label>
            <textarea
              value={diseases}
              onChange={e => setDiseases(e.target.value)}
              placeholder={"Ehlers-Danlos syndrome\npostural orthostatic tachycardia syndrome\nmast cell activation syndrome"}
              rows={3}
              disabled={isRunning}
            />
            <div className="hint">Auto-resolved via MONDO ontology with full synonym coverage</div>
          </div>
          <div className="input-group">
            <label>Comorbidities to detect (optional, one per line)</label>
            <textarea
              value={comorbidities}
              onChange={e => setComorbidities(e.target.value)}
              placeholder={"Chiari malformation\ngastroparesis\nsmall fiber neuropathy"}
              rows={2}
              disabled={isRunning}
            />
          </div>
          <button className="primary" onClick={generateConfig} disabled={isRunning || !diseases.trim()}>
            Generate Config
          </button>
        </div>

        {/* Step 2: PMC Search */}
        <div className="panel-section">
          <h3>
            <span className={`step-number ${stepState(2)}`}>2</span>
            PMC Article Search
          </h3>
          <div className="input-group">
            <label>Search query (topic)</label>
            <textarea
              value={pmcQuery}
              onChange={e => setPmcQuery(e.target.value)}
              placeholder='"Ehlers-Danlos syndrome" OR "POTS"'
              rows={3}
              disabled={isRunning}
            />
            <div className="hint">
              Topic terms only. Searched in PubMed and restricted to PMC
              open-access full text; paper-type filtering is applied below.
            </div>
          </div>
          <div className="input-group">
            <label>Filter by paper type</label>
            <div className="checkbox-grid">
              {PUB_TYPE_OPTIONS.map(opt => (
                <label key={opt.id} className="checkbox-item">
                  <input
                    type="checkbox"
                    checked={!!pubTypes[opt.id]}
                    onChange={() => togglePubType(opt.id)}
                    disabled={isRunning}
                  />
                  {opt.label}
                </label>
              ))}
            </div>
            <div className="hint">
              Tick to include only those types (combined with OR). Leave all
              unticked for every type. Note: extraction still processes case
              reports only.
            </div>
          </div>
          <div className="input-group">
            <label>Max results</label>
            <div className="slider-row">
              <input type="range" min={10} max={1000} step={10} value={maxArticles}
                onChange={e => setMaxArticles(parseInt(e.target.value))} disabled={isRunning} />
              <span className="slider-val">{maxArticles}</span>
            </div>
          </div>
          <button className="primary" onClick={searchPMC} disabled={isRunning || !pmcQuery.trim()}>
            Search PMC
          </button>

          {pmcResults && pmcResults.total > 0 && (
            <div style={{ marginTop: 10 }}>
              <div style={{ fontSize: 12, color: 'var(--green)', fontWeight: 600 }}>
                {pmcResults.total.toLocaleString()} articles found ({pmcResults.downloadable} retrievable)
              </div>
              <div className="pmc-preview">
                {pmcResults.results.slice(0, 8).map((r, i) => (
                  <div className="pmc-preview-item" key={i}>
                    <span className="pmc-title">{r.pmcid}</span> {r.title?.substring(0, 80)}...
                  </div>
                ))}
                {pmcResults.results.length > 8 && (
                  <div style={{ color: 'var(--text-dim)', padding: '4px 0', fontSize: 11 }}>
                    ...and {pmcResults.downloadable - 8} more
                  </div>
                )}
              </div>
            </div>
          )}
        </div>

        {/* Step 3: Download */}
        <div className="panel-section">
          <h3>
            <span className={`step-number ${stepState(3)}`}>3</span>
            Download Articles
          </h3>
          <div className="input-group">
            <label>Articles to download</label>
            <div className="slider-row">
              <input type="range" min={5} max={500} step={5} value={maxDownload}
                onChange={e => setMaxDownload(parseInt(e.target.value))} disabled={isRunning} />
              <span className="slider-val">{maxDownload}</span>
            </div>
          </div>
          <button className="primary" onClick={downloadArticles}
            disabled={isRunning || !pmcResults?.downloadable}>
            Download Full Text
          </button>
          {articlesCount > 0 && (
            <div style={{ marginTop: 6, fontSize: 12, color: 'var(--green)' }}>
              {articlesCount} articles ready
            </div>
          )}
        </div>

        {/* Step 4: Extract */}
        <div className="panel-section">
          <h3>
            <span className={`step-number ${stepState(4)}`}>4</span>
            Run Extraction
          </h3>

          {/* LLM toggle */}
          <div className="input-group" style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 10 }}>
            <input type="checkbox" id="llm-toggle" checked={enableLLM}
              onChange={e => setEnableLLM(e.target.checked)} disabled={isRunning}
              style={{ width: 'auto', margin: 0 }} />
            <label htmlFor="llm-toggle" style={{ margin: 0, fontWeight: 600, color: enableLLM ? 'var(--accent)' : 'var(--text-dim)' }}>
              LLM Enhancement (SPELL-style hybrid)
            </label>
          </div>

          {enableLLM && (
            <div style={{ background: 'var(--bg)', borderRadius: 6, padding: 10, marginBottom: 10, border: '1px solid var(--border)' }}>
              <div className="input-group">
                <label>Provider</label>
                <select value={llmProvider} onChange={e => setLlmProvider(e.target.value)}
                  disabled={isRunning}
                  style={{ width: '100%', background: 'var(--surface2)', border: '1px solid var(--border)',
                    borderRadius: 6, color: 'var(--text)', padding: '6px 8px', fontSize: 13 }}>
                  <option value="anthropic">Anthropic (Claude)</option>
                  <option value="openai">OpenAI (GPT-4o)</option>
                </select>
              </div>
              <div className="input-group">
                <label>API Key</label>
                <input type="password" value={llmApiKey}
                  onChange={e => setLlmApiKey(e.target.value)}
                  placeholder={llmProvider === 'anthropic' ? 'sk-ant-...' : 'sk-...'}
                  disabled={isRunning} />
              </div>
              <div className="input-group">
                <label>Model (blank = default)</label>
                <input value={llmModel} onChange={e => setLlmModel(e.target.value)}
                  placeholder={llmProvider === 'anthropic' ? 'claude-sonnet-4-20250514' : 'gpt-4o'}
                  disabled={isRunning} />
              </div>
              <div className="hint">
                Enhances: temporal reasoning, family history, treatment chains.
                Each extraction tagged with method source for comparison.
              </div>
            </div>
          )}

          <button className="primary" onClick={runPipeline}
            disabled={isRunning || !configReady || articlesCount === 0 || (enableLLM && !llmApiKey)}>
            {enableLLM ? 'Run Hybrid Pipeline' : 'Run Pipeline (Rule-based)'}
          </button>
          <div className="hint" style={{ marginTop: 6 }}>
            {!configReady && 'Generate config first'}
            {configReady && articlesCount === 0 && 'Download articles first'}
            {configReady && articlesCount > 0 && !enableLLM && `Ready to extract from ${articlesCount} articles (rule-based)`}
            {configReady && articlesCount > 0 && enableLLM && !llmApiKey && 'Enter API key to enable LLM enhancement'}
            {configReady && articlesCount > 0 && enableLLM && llmApiKey && `Ready: ${articlesCount} articles, hybrid mode (3 API calls/article)`}
          </div>
        </div>

      </div>

      {/* Right: Log + Results */}
      <div className="main-panel">
        <div className="tab-bar">
          <div className={`tab ${activeTab === 'log' ? 'active' : ''}`} onClick={() => setActiveTab('log')}>
            Live Log ({logs.length})
          </div>
          <div className={`tab ${activeTab === 'results' ? 'active' : ''}`} onClick={() => setActiveTab('results')}>
            Results {results?.count > 0 ? `(${results.count})` : ''}
          </div>
          <div className={`tab ${activeTab === 'files' ? 'active' : ''}`} onClick={() => setActiveTab('files')}>
            Output Files {outputFiles.length > 0 ? `(${outputFiles.length})` : ''}
          </div>
          <div className={`tab ${activeTab === 'review' ? 'active' : ''}`} onClick={() => { setActiveTab('review'); loadCorrections(); }}>
            Review {corrections.length > 0 ? `(${corrections.length})` : ''}
          </div>
          <div style={{ marginLeft: 'auto', display: 'flex', alignItems: 'center' }}>
            <button className="secondary" onClick={clearLogs}
              style={{ width: 'auto', padding: '4px 12px', fontSize: 11 }}>
              Clear Log
            </button>
          </div>
        </div>

        <div className="tab-content">
          {activeTab === 'log' && <LogView logs={logs} logEndRef={logEndRef} />}
          {activeTab === 'results' && <ResultsView results={results} />}
          {activeTab === 'files' && <FilesView files={outputFiles} />}
          {activeTab === 'review' && <ReviewView corrections={corrections} onCorrectionsChange={loadCorrections} />}
        </div>
      </div>
    </div>
  );
}

function LogView({ logs, logEndRef }) {
  if (logs.length === 0) {
    return (
      <div className="empty-state">
        <div className="icon">&#9654;</div>
        <div>No log entries yet. Generate a config to start.</div>
      </div>
    );
  }

  return (
    <div className="log-container">
      {logs.map((entry, i) => (
        <div className={`log-line ${entry.level}`} key={i}>
          <span className="time">{entry.time}</span>
          <span className="msg">{entry.message}</span>
        </div>
      ))}
      <div ref={logEndRef} />
    </div>
  );
}

function BarChart({ data, maxVal }) {
  if (!data || data.length === 0) return null;
  const max = maxVal || Math.max(...data.map(d => d[1]));

  return (
    <div className="bar-chart">
      {data.map(([label, count], i) => (
        <div className="bar-row" key={i}>
          <span className="bar-label" title={label}>
            {label.replace(/_/g, ' ')}
          </span>
          <div className="bar-track">
            <div className="bar-fill" style={{ width: `${(count / max) * 100}%` }} />
          </div>
          <span className="bar-count">{count}</span>
        </div>
      ))}
    </div>
  );
}

function ResultsView({ results }) {
  if (!results || !results.summary) {
    return (
      <div className="empty-state">
        <div className="icon">&#128202;</div>
        <div>No results yet. Run the pipeline to see extraction results.</div>
      </div>
    );
  }

  const s = results.summary;

  return (
    <div>
      <div className="results-grid">
        <div className="stat-card">
          <div className="stat-label">Articles Processed</div>
          <div className="stat-value">{results.count}</div>
          <div className="stat-detail">{results.errors} errors</div>
        </div>
        <div className="stat-card">
          <div className="stat-label">Mean Age</div>
          <div className="stat-value">{s.age_mean ?? 'N/A'}</div>
          <div className="stat-detail">
            {s.age_range ? `Range: ${s.age_range[0]}–${s.age_range[1]}` : ''}
          </div>
        </div>
        <div className="stat-card">
          <div className="stat-label">Sex Distribution</div>
          <div className="stat-value" style={{ fontSize: 16 }}>
            {Object.entries(s.sex_distribution || {}).map(([k, v]) => `${k}: ${v}`).join(', ')}
          </div>
        </div>
        <div className="stat-card">
          <div className="stat-label">Mean Completeness</div>
          <div className="stat-value">{(s.avg_completeness * 100).toFixed(1)}%</div>
        </div>
      </div>

      <div className="section-title">Top Symptoms (by article count)</div>
      <BarChart data={s.top_symptoms} />

      <div className="section-title">Top Drugs</div>
      <BarChart data={s.top_drugs} />

      {s.top_comorbidities?.length > 0 && (
        <>
          <div className="section-title">Comorbidities</div>
          <BarChart data={s.top_comorbidities} />
        </>
      )}
    </div>
  );
}

function FilesView({ files }) {
  if (!files || files.length === 0) {
    return (
      <div className="empty-state">
        <div className="icon">&#128193;</div>
        <div>No output files yet.</div>
      </div>
    );
  }

  const formatSize = (bytes) => {
    if (bytes < 1024) return `${bytes} B`;
    if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
    return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
  };

  const totalSize = files.reduce((s, f) => s + (f.size || 0), 0);

  return (
    <div>
      <div className="files-header">
        <div className="section-title">Download Output Files</div>
        <a className="primary download-all-btn" href="/api/download-all" download>
          &#11015; Download all ({files.length} files, {formatSize(totalSize)})
        </a>
      </div>
      <div className="file-list">
        {files.map((f, i) => (
          <div className="file-item" key={i}>
            <span className="fname">{f.name}</span>
            <span className="fsize">{formatSize(f.size)}</span>
            <a href={`/api/download/${f.name}`} download>Download</a>
          </div>
        ))}
      </div>
    </div>
  );
}

function ReviewView({ corrections, onCorrectionsChange }) {
  const [articles, setArticles] = useState([]);
  const [selectedArticle, setSelectedArticle] = useState(null);
  const [extraction, setExtraction] = useState(null);
  const [showForm, setShowForm] = useState(false);
  const [formData, setFormData] = useState({
    subtask: 'general', pattern: '', error_description: '',
    fix_instruction: '', pmcid: '', field: '',
    example_wrong: '', example_right: '',
  });

  useEffect(() => {
    fetch('/api/review').then(r => r.json()).then(d => setArticles(d.articles || [])).catch(() => {});
  }, []);

  const loadArticle = async (pmcid) => {
    setSelectedArticle(pmcid);
    try {
      const r = await fetch(`/api/review/${pmcid}`);
      const data = await r.json();
      setExtraction(data.extraction);
    } catch (e) {}
  };

  const submitCorrection = async () => {
    if (!formData.pattern || !formData.error_description || !formData.fix_instruction) return;
    await fetch('/api/correction', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(formData),
    });
    setFormData({ subtask: 'general', pattern: '', error_description: '',
      fix_instruction: '', pmcid: selectedArticle || '', field: '',
      example_wrong: '', example_right: '' });
    setShowForm(false);
    onCorrectionsChange();
  };

  const deleteCorrection = async (id) => {
    await fetch(`/api/correction/${id}`, { method: 'DELETE' });
    onCorrectionsChange();
  };

  const renderValue = (val) => {
    if (val === null || val === undefined) return <span style={{ color: 'var(--text-dim)' }}>null</span>;
    if (typeof val === 'boolean') return <span style={{ color: val ? 'var(--green)' : 'var(--red)' }}>{String(val)}</span>;
    if (typeof val === 'object') return <pre style={{ margin: 0, fontSize: 11, color: 'var(--text)', whiteSpace: 'pre-wrap' }}>{JSON.stringify(val, null, 1)}</pre>;
    return String(val);
  };

  const reviewableFields = extraction ? [
    { section: 'Temporal', fields: [
      ['age_at_onset', extraction.age_at_onset],
      ['symptom_duration_years', extraction.symptom_duration_years],
      ['diagnostic_delay_years', extraction.diagnostic_delay_years],
      ['_temporal_method', extraction._temporal_method],
    ]},
    { section: 'Family History', fields: [
      ['has_family_history', extraction.family_history?.has_family_history],
      ['family_members_detailed', extraction.family_history?.family_members_detailed],
      ['inheritance_pattern', extraction.family_history?.inheritance_pattern],
      ['_family_history_method', extraction.family_history?._family_history_method],
    ]},
    { section: 'Treatment Responses', fields: [
      ['treatment_count', extraction.treatment_responses?.length || 0],
      ['treatments', extraction.treatment_responses],
    ]},
    { section: 'Demographics', fields: [
      ['age_at_presentation', extraction.age_at_presentation],
      ['sex', extraction.sex],
    ]},
  ] : [];

  return (
    <div>
      {/* Correction form */}
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 12 }}>
        <div className="section-title" style={{ margin: 0, border: 'none', paddingBottom: 0 }}>
          Review Extractions & Submit Corrections
        </div>
        <button className="primary" onClick={() => setShowForm(!showForm)}
          style={{ width: 'auto', padding: '6px 14px' }}>
          {showForm ? 'Cancel' : '+ Add Correction'}
        </button>
      </div>

      {showForm && (
        <div style={{ background: 'var(--surface2)', border: '1px solid var(--border)', borderRadius: 8, padding: 14, marginBottom: 16 }}>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}>
            <div className="input-group">
              <label>Subtask</label>
              <select value={formData.subtask} onChange={e => setFormData({...formData, subtask: e.target.value})}
                style={{ width: '100%', background: 'var(--bg)', border: '1px solid var(--border)',
                  borderRadius: 6, color: 'var(--text)', padding: '6px 8px', fontSize: 13 }}>
                <option value="temporal">Temporal reasoning</option>
                <option value="family_history">Family history</option>
                <option value="treatment">Treatment chains</option>
                <option value="general">General</option>
              </select>
            </div>
            <div className="input-group">
              <label>Pattern slug (short identifier)</label>
              <input value={formData.pattern} onChange={e => setFormData({...formData, pattern: e.target.value})}
                placeholder="e.g. possessive_family_ref" />
            </div>
            <div className="input-group" style={{ gridColumn: '1 / -1' }}>
              <label>What went wrong?</label>
              <input value={formData.error_description}
                onChange={e => setFormData({...formData, error_description: e.target.value})}
                placeholder="e.g. Missed family history when relatives described possessively" />
            </div>
            <div className="input-group" style={{ gridColumn: '1 / -1' }}>
              <label>How to fix it (instruction for the LLM)</label>
              <input value={formData.fix_instruction}
                onChange={e => setFormData({...formData, fix_instruction: e.target.value})}
                placeholder="e.g. Treat possessive references to relatives as evidence of family history" />
            </div>
            <div className="input-group">
              <label>Example wrong output (optional)</label>
              <input value={formData.example_wrong}
                onChange={e => setFormData({...formData, example_wrong: e.target.value})}
                placeholder='e.g. {"has_family_history": null}' />
            </div>
            <div className="input-group">
              <label>Example correct output (optional)</label>
              <input value={formData.example_right}
                onChange={e => setFormData({...formData, example_right: e.target.value})}
                placeholder='e.g. {"has_family_history": true}' />
            </div>
          </div>
          <button className="primary" onClick={submitCorrection}
            disabled={!formData.pattern || !formData.error_description || !formData.fix_instruction}
            style={{ marginTop: 10 }}>
            Save Correction
          </button>
        </div>
      )}

      {/* Existing corrections */}
      {corrections.length > 0 && (
        <div style={{ marginBottom: 20 }}>
          <div className="section-title">Active Corrections ({corrections.length})</div>
          {corrections.map((c, i) => (
            <div key={i} style={{ background: 'var(--surface2)', border: '1px solid var(--border)',
              borderRadius: 6, padding: '8px 12px', marginBottom: 6, fontSize: 12, display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
              <div>
                <span style={{ color: 'var(--accent)', fontWeight: 600, fontFamily: 'var(--font)', fontSize: 11 }}>
                  [{c.subtask}]
                </span>{' '}
                <span style={{ fontWeight: 600 }}>{c.pattern}</span>
                <span style={{ color: 'var(--text-dim)' }}> x{c.recurrence_count}</span>
                <div style={{ color: 'var(--text-dim)', marginTop: 2 }}>{c.error_description}</div>
                <div style={{ color: 'var(--green)', marginTop: 2 }}>Fix: {c.fix_instruction}</div>
              </div>
              <button className="secondary" onClick={() => deleteCorrection(c.id)}
                style={{ width: 'auto', padding: '2px 8px', fontSize: 10, flexShrink: 0 }}>
                Remove
              </button>
            </div>
          ))}
        </div>
      )}

      {/* Article list */}
      <div style={{ display: 'grid', gridTemplateColumns: '240px 1fr', gap: 12 }}>
        <div>
          <div className="section-title">Articles ({articles.length})</div>
          <div style={{ maxHeight: 500, overflowY: 'auto' }}>
            {articles.map((a, i) => (
              <div key={i} onClick={() => loadArticle(a.pmcid)}
                style={{ padding: '6px 10px', cursor: 'pointer', fontSize: 12, borderRadius: 4,
                  background: selectedArticle === a.pmcid ? 'var(--accent-dim)' : 'transparent',
                  borderBottom: '1px solid var(--border)' }}>
                <div style={{ fontFamily: 'var(--font)', fontWeight: 600 }}>{a.pmcid}</div>
                <div style={{ color: 'var(--text-dim)', fontSize: 11 }}>
                  {a.symptom_count}sym {a.drug_count}drugs {(a.completeness * 100).toFixed(0)}%
                  {a.llm_enhanced && <span style={{ color: 'var(--accent)' }}> +LLM</span>}
                </div>
              </div>
            ))}
            {articles.length === 0 && (
              <div style={{ color: 'var(--text-dim)', fontSize: 12, padding: 10 }}>
                Run the pipeline first to see articles here.
              </div>
            )}
          </div>
        </div>

        <div>
          {extraction ? (
            <div>
              <div className="section-title">
                {selectedArticle}
                {extraction._llm_enhanced && <span style={{ color: 'var(--accent)', fontSize: 11, marginLeft: 8 }}>LLM enhanced</span>}
              </div>
              {reviewableFields.map((sec, si) => (
                <div key={si} style={{ marginBottom: 12 }}>
                  <div style={{ fontSize: 11, fontWeight: 700, color: 'var(--text-dim)', textTransform: 'uppercase',
                    letterSpacing: '0.5px', marginBottom: 4 }}>{sec.section}</div>
                  {sec.fields.map(([fname, fval], fi) => (
                    <div key={fi} style={{ display: 'flex', gap: 8, padding: '3px 0', borderBottom: '1px solid var(--border)',
                      fontSize: 12, alignItems: 'flex-start' }}>
                      <span style={{ width: 200, flexShrink: 0, fontFamily: 'var(--font)', fontSize: 11,
                        color: fname.startsWith('_') ? 'var(--accent)' : 'var(--text-dim)' }}>{fname}</span>
                      <span style={{ flex: 1 }}>{renderValue(fval)}</span>
                      {!fname.startsWith('_') && (
                        <button className="secondary" onClick={() => {
                          setFormData({...formData, pmcid: selectedArticle, field: fname,
                            subtask: sec.section === 'Temporal' ? 'temporal' :
                              sec.section === 'Family History' ? 'family_history' :
                              sec.section === 'Treatment Responses' ? 'treatment' : 'general',
                          });
                          setShowForm(true);
                        }}
                        style={{ width: 'auto', padding: '1px 6px', fontSize: 10, flexShrink: 0 }}>
                          Flag
                        </button>
                      )}
                    </div>
                  ))}
                </div>
              ))}
            </div>
          ) : (
            <div className="empty-state">
              <div className="icon">&#128269;</div>
              <div>Select an article to review its extraction.</div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
