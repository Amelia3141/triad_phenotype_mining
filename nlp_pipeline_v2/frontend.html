                  <div className="hint">Full-text XML is pulled from the PMC open-access service. Tick to fetch every retrieved (non-excluded) article.</div>
                </div>
                <button className="btn primary" onClick={downloadArticles} disabled={isRunning || !(pmcResults && pmcResults.downloadable)}>Download full text</button>
                {meter.phase === 'Downloading full text' && isRunning && <ProgressMeter meter={meter} />}
                {articlesCount > 0 && <div className="gate-hint ready" style={{ marginTop: 9 }}>✓ {articlesCount} articles ready to extract</div>}
              </div>
            </div>
          </div>

          {/* Step 4 */}
          <div className={stepClass(4)}>
            <div className="node">{stepDone[4] ? '✓' : '4'}</div>
            <div className="step-card">
              <div className="step-header" onClick={() => goStep(4)}>
                <span className="st-title">Extract phenotypes</span>
                {stepLocked[4] && <span className="st-sum">Locked</span>}
                {stepDone[4] && activeStep !== 4 && <span className="st-sum">{results.count} extracted</span>}
                <span className="chev">▸</span>
              </div>
              <div className={'step-body' + (activeStep === 4 ? '' : ' collapsed')}>
                <div className="switch-row" style={{ marginBottom: 12 }}>
                  <label className="switch"><input type="checkbox" checked={validateOntology} disabled={isRunning} onChange={e => setValidateOntology(e.target.checked)} /><span className="track"></span></label>
                  <div>
                    <div className="sw-label">Ontology validation <span style={{ color: 'var(--ok)', fontWeight: 600 }}>· max precision</span></div>
                    <div className="sw-sub">Keep only discovered drugs/comorbidities that resolve in RxNorm / Mondo</div>
                  </div>
                </div>
                <div className="switch-row" style={{ marginBottom: 12 }}>
                  <label className="switch"><input type="checkbox" checked={enableLLM} disabled={isRunning} onChange={e => setEnableLLM(e.target.checked)} /><span className="track"></span></label>
                  <div>
                    <div className="sw-label">LLM enhancement</div>
                    <div className="sw-sub">Hybrid rule-based + LLM for temporal, family history & treatment chains</div>
                  </div>
                </div>
                {enableLLM && (
                  <div style={{ background: 'var(--panel-2)', border: '1px solid var(--line)', borderRadius: 8, padding: 12, marginBottom: 12 }}>
                    <div className="field" style={{ marginBottom: 10 }}>
                      <label className="field-label">Provider</label>
                      <select value={llmProvider} disabled={isRunning} onChange={e => setLlmProvider(e.target.value)}>
                        <option value="anthropic">Anthropic (Claude)</option>
                        <option value="openai">OpenAI (GPT-4o)</option>
                      </select>
                    </div>
                    <div className="field" style={{ marginBottom: 10 }}>
                      <label className="field-label">API key</label>
                      <input type="password" value={llmApiKey} disabled={isRunning} onChange={e => setLlmApiKey(e.target.value)} placeholder={llmProvider === 'anthropic' ? 'sk-ant-…' : 'sk-…'} />
                    </div>
                    <div className="field" style={{ marginBottom: 0 }}>
                      <label className="field-label">Model <span style={{ color: 'var(--ink-3)', fontWeight: 400 }}>(blank = default)</span></label>
                      <input type="text" value={llmModel} disabled={isRunning} onChange={e => setLlmModel(e.target.value)} placeholder={llmProvider === 'anthropic' ? 'claude-sonnet-4-20250514' : 'gpt-4o'} />
                    </div>
                  </div>
                )}
                <button className="btn primary" onClick={runPipeline} disabled={isRunning || !canRun}>
                  {enableLLM ? '▸ Run hybrid pipeline' : '▸ Run pipeline (rule-based)'}
                </button>
                {meter.phase === 'Extracting phenotypes' && isRunning && <ProgressMeter meter={meter} />}
                {!isRunning && (
                  <div className={'gate-hint' + (canRun ? ' ready' : '')} style={{ marginTop: 9 }}>
                    {!configReady ? '◷ Generate a config first'
                      : articlesCount === 0 ? '◷ Download articles first'
                      : llmBlocked ? '◷ Enter an API key to use LLM enhancement'
                      : `✓ Ready: ${articlesCount} articles${enableLLM ? ', hybrid mode' : ', rule-based'}`}
                  </div>
                )}
              </div>
            </div>
          </div>

        </div>
      </div>

      {/* Output column */}
      <div className="output-col">
        {disconnected && <div className="demo-banner">⚠ Backend not reachable — no data is shown. Start <code style={{fontFamily:'var(--mono)'}}>web_app.py</code> and open the app via that server (e.g. http://localhost:8010).</div>}
        <div className="tabbar">
          {[
            ['results', 'Results', results && results.count ? results.count : null],
            ['search', 'Search results', pmcResults && pmcResults.results ? pmcResults.results.length : null],
            ['log', 'Live log', logs.length || null],
            ['files', 'Output files', outputFiles.length || null],
            ['review', 'Review', corrections.length || null],
          ].map(([id, label, cnt]) => (
            <div key={id} className={'tab' + (activeTab === id ? ' active' : '')} onClick={() => { setActiveTab(id); if (id === 'review') loadCorrections(); }}>
              {label}{cnt ? <span className="cnt">{cnt}</span> : null}
            </div>
          ))}
          <div className="tab-tools">
            {activeTab === 'log' && <button className="btn ghost sm" onClick={() => setLogs([])}>Clear log</button>}
          </div>
        </div>
        <div className="tab-content">
          {activeTab === 'results' && <ResultsView results={results} />}
          {activeTab === 'search' && <SearchView pmcResults={pmcResults} excluded={excluded} setExcluded={setExcluded} />}
          {activeTab === 'log' && <LogView logs={logs} logEndRef={logEndRef} status={status} />}
          {activeTab === 'files' && <FilesView files={outputFiles} disconnected={disconnected} />}
          {activeTab === 'review' && <ReviewView corrections={corrections} reload={loadCorrections} />}
        </div>
      </div>
    </div>
  );
}

// ── Chip input ──
function ChipInput({ values, onChange, placeholder, disabled, kind }) {
  const [draft, setDraft] = useState('');
  const [focus, setFocus] = useState(false);
  const inputRef = useRef(null);
  const commit = () => {
    const v = draft.trim();
    if (v && !values.includes(v)) onChange([...values, v]);
    setDraft('');
  };
  const onKey = (e) => {
    if ((e.key === 'Enter' || e.key === ',') ) { e.preventDefault(); commit(); }
    else if (e.key === 'Backspace' && !draft && values.length) onChange(values.slice(0, -1));
  };
  return (
    <div className={'chip-input' + (focus ? ' focus' : '') + (disabled ? ' disabled' : '')} onClick={() => !disabled && inputRef.current && inputRef.current.focus()}>
      {values.map((v, i) => (
        <span key={i} className={'chip' + (kind === 'comorb' ? ' comorb' : '')}>
          <span className="ct">{v}</span>
          {!disabled && <button className="x" onClick={(e) => { e.stopPropagation(); onChange(values.filter((_, j) => j !== i)); }}>×</button>}
        </span>
      ))}
      <input ref={inputRef} value={draft} disabled={disabled} placeholder={values.length ? '' : placeholder}
        onChange={e => setDraft(e.target.value)} onKeyDown={onKey} onBlur={() => { setFocus(false); commit(); }} onFocus={() => setFocus(true)} />
    </div>
  );
}

// ── In-step progress meter ──
function ProgressMeter({ meter }) {
  const pct = meter.total ? Math.min(100, Math.round(meter.cur / meter.total * 100)) : null;
  return (
    <div className="step-progress">
      <div className="sp-top">
        <span className="sp-phase">{meter.phase || 'Working…'}</span>
        <span className="sp-count">{meter.total ? `${meter.cur} / ${meter.total}` : ''}</span>
      </div>
      <div className="sp-track">
        <div className="sp-fill" style={{ width: pct != null ? pct + '%' : '40%', opacity: pct == null ? .5 : 1 }}></div>
      </div>
      <div className="sp-eta">{pct != null ? pct + '% complete' : 'In progress…'}{meter.eta != null && meter.eta > 0 ? `  ·  ~${meter.eta}s remaining` : ''}</div>
    </div>
  );
}

// ── Results ──
function ResultsView({ results }) {
  const [comorbAsPct, setComorbAsPct] = useState(true);   // "analyse comorbidity" — show rates as %
  if (!results || !results.count) return (
    <div className="empty">
      <div className="ei">📊</div>
      <div className="et">No results yet</div>
      <div className="es">Run the full pipeline to see cohort demographics, symptom and drug frequencies, condition co-occurrence and comorbidity analysis.</div>
    </div>
  );
  const s = results.summary || {};
  const sex = s.sex_distribution || {};
  const sexTotal = Object.values(sex).reduce((a, b) => a + b, 0) || 1;
  const femPct = Math.round((sex.female || 0) / sexTotal * 100);
  const maxOf = (arr) => Math.max(1, ...(arr || []).map(x => x[1]));

  const BarBlock = ({ title, note, data, color }) => {
    const max = maxOf(data);
    return (
      <div className="panel-card">
        <div className="pc-head"><h3>{title}</h3>{note && <span className="pc-note">{note}</span>}</div>
        <div className="pc-body">
          <div className="bars">
            {(data || []).map(([label, n], i) => (
              <div className="bar-row" key={i}>
                <span className="bar-label" title={label}>{label}</span>
                <div className="bar-track"><div className="bar-fill" style={{ width: (n / max * 100) + '%', background: color }}></div></div>
                <span className="bar-count">{n}</span>
              </div>
            ))}
          </div>
        </div>
      </div>
    );
  };

  // Condition co-occurrence (live `condition_presence`/`cooccurrence`, with a
  // fallback to the older `triad`/`cooc` demo keys).
  const presence = s.condition_presence || s.triad || [];
  const cooc = s.cooccurrence || s.cooc || [];
  const coocMax = Math.max(1, ...cooc.map(c => c.count));
  const showCooc = presence.length >= 2 || cooc.length > 0;

  // Comorbidity analysis. Prefer rate objects; fall back to [name,count] pairs.
  const validN = Math.max(1, (results.count || 0) - (results.errors || 0));
  const comorbRates = (s.comorbidity_rates && s.comorbidity_rates.length)
    ? s.comorbidity_rates
    : (s.top_comorbidities || []).map(([name, count]) => ({ name, count, pct: Math.round(count / validN * 1000) / 10 }));
  const comorbAny = s.comorbidity_any || (comorbRates.length
    ? { count: null, pct: null }
    : null);
  const comorbMax = comorbAsPct
    ? Math.max(1, ...comorbRates.map(c => c.pct || 0))
    : Math.max(1, ...comorbRates.map(c => c.count || 0));

  return (
    <div>
      <div className="stat-grid">
        <div className="stat-card">
          <div className="sl">Cases extracted</div>
          <div className="sv brand">{results.count}</div>
          <div className="sd">{results.errors ? results.errors + ' parse errors' : 'no parse errors'}</div>
        </div>
        <div className="stat-card">
          <div className="sl">Mean age</div>
          <div className="sv">{s.age_mean != null ? s.age_mean.toFixed(1) : '—'}<span style={{ fontSize: 14, color: 'var(--ink-3)', fontWeight: 500 }}> yrs</span></div>
          <div className="sd">range {s.age_range ? s.age_range[0] + '–' + s.age_range[1] : '—'}</div>
        </div>
        <div className="stat-card">
          <div className="sl">Sex distribution</div>
          <div className="sv">{femPct}%<span style={{ fontSize: 14, color: 'var(--ink-3)', fontWeight: 500 }}> F</span></div>
          <div className="sd">{sex.female || 0}F · {sex.male || 0}M{sex.unknown ? ' · ' + sex.unknown + '?' : ''}</div>
        </div>
        <div className="stat-card">
          <div className="sl">Mean completeness</div>
          <div className="sv">{s.avg_completeness != null ? Math.round(s.avg_completeness * 100) + '%' : '—'}</div>
          <div className="sd">fields populated per case</div>
        </div>
      </div>

      {showCooc && (
        <div className="panel-card">
          <div className="pc-head"><h3>Condition co-occurrence</h3><span className="pc-note">how often the defined conditions appear together</span></div>
          <div className="pc-body">
            <div className="triad-wrap">
              <div className="cooc-legend" style={{ flex: '1 1 240px' }}>
                <div style={{ fontSize: 11, fontWeight: 700, color: 'var(--ink-3)', textTransform: 'uppercase', letterSpacing: '.5px', marginBottom: 2 }}>Condition presence</div>
                {presence.map((t, i) => (
                  <div className="cooc-item" key={i} title={t.full_name || t.name}>
                    <span className="sw" style={{ background: TRIAD_COLORS[i % TRIAD_COLORS.length] }}></span>
                    <span className="nm">{t.name}</span>
                    <span className="vv">{t.count} <small>cases{t.pct != null ? ' · ' + t.pct + '%' : ''}</small></span>
                  </div>
                ))}
                {cooc.length > 0 && <>
                  <div style={{ height: 1, background: 'var(--line-2)', margin: '4px 0' }}></div>
                  <div style={{ fontSize: 11, fontWeight: 700, color: 'var(--ink-3)', textTransform: 'uppercase', letterSpacing: '.5px', marginBottom: 2 }}>Overlap</div>
                </>}
                {cooc.map((c, i) => {
                  const full = c.full != null ? c.full : /\ball\b|three|full/i.test(c.name);
                  return (
                    <div key={i}>
                      <div className="cooc-item" style={{ marginBottom: 3 }}>
                        <span className="nm" style={{ fontWeight: full ? 700 : 500, color: full ? 'var(--ink)' : 'var(--ink-2)' }}>{c.name}</span>
                        <span className="vv">{c.count}{c.pct != null ? <small> · {c.pct}%</small> : null}</span>
                      </div>
                      <div className="bar-track" style={{ height: 8 }}><div className="bar-fill" style={{ width: (c.count / coocMax * 100) + '%', background: full ? 'linear-gradient(90deg, var(--t1), var(--t2), var(--t3))' : 'var(--brand)' }}></div></div>
                    </div>
                  );
                })}
              </div>
            </div>
          </div>
        </div>
      )}

      {s.top_symptoms && <BarBlock title="Top symptoms" note={s.top_symptoms.length + ' tracked'} data={s.top_symptoms.slice(0, 12)} color="var(--t1)" />}
      {s.top_drugs && <BarBlock title="Top treatments" note="medications detected" data={s.top_drugs.slice(0, 12)} color="var(--t2)" />}

      {comorbRates.length > 0 && (
        <div className="panel-card">
          <div className="pc-head">
            <h3>Comorbidity analysis</h3>
            <span className="pc-note">other diseases reported alongside the case</span>
            <div className="switch-row" style={{ marginLeft: 'auto', padding: '5px 9px', gap: 8 }}>
              <label className="switch" style={{ width: 34, height: 20 }}>
                <input type="checkbox" checked={comorbAsPct} onChange={e => setComorbAsPct(e.target.checked)} />
                <span className="track"></span>
              </label>
              <span className="sw-label" style={{ fontSize: 12 }}>Show as %</span>
            </div>
          </div>
          <div className="pc-body">
            {comorbAny && comorbAny.pct != null && (
              <div style={{ display: 'flex', alignItems: 'baseline', gap: 10, marginBottom: 14, paddingBottom: 12, borderBottom: '1px solid var(--line-2)' }}>
                <span style={{ fontSize: 28, fontWeight: 700, color: 'var(--brand-ink)', letterSpacing: '-.5px' }}>{comorbAny.pct}%</span>
                <span style={{ fontSize: 12.5, color: 'var(--ink-2)' }}>
                  of cases report at least one comorbidity{comorbAny.count != null ? ` (${comorbAny.count} of ${validN})` : ''}
                </span>
              </div>
            )}
            <div className="bars">
              {comorbRates.slice(0, 12).map((c, i) => {
                const val = comorbAsPct ? (c.pct || 0) : (c.count || 0);
                return (
                  <div className="bar-row" key={i}>
                    <span className="bar-label" title={c.name}>{c.name}</span>
                    <div className="bar-track"><div className="bar-fill" style={{ width: (val / comorbMax * 100) + '%', background: 'var(--t3)' }}></div></div>
                    <span className="bar-count">{comorbAsPct ? (c.pct != null ? c.pct + '%' : '—') : c.count}</span>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ── Search results (reviewable) ──
function SearchView({ pmcResults, excluded, setExcluded }) {
  const [filter, setFilter] = useState('');
  if (!pmcResults || !pmcResults.results || !pmcResults.results.length) return (
    <div className="empty">
      <div className="ei">🔍</div>
      <div className="et">No search yet</div>
      <div className="es">Run a PubMed Central search in step 2. Matching articles appear here so you can review titles and de-select any you don't want before downloading.</div>
    </div>
  );
  const rows = pmcResults.results;
  const visible = rows.filter(r => !filter || (r.title || '').toLowerCase().includes(filter.toLowerCase()) || (r.pmcid || '').toLowerCase().includes(filter.toLowerCase()));
  const includedN = rows.filter(r => !excluded[r.pmcid]).length;
  const setAll = (val) => { const m = {}; if (val) rows.forEach(r => m[r.pmcid] = true); setExcluded(m); };
  return (
    <div>
      <div className="sr-toolbar">
        <input type="text" placeholder="Filter previewed titles…" value={filter} onChange={e => setFilter(e.target.value)} style={{ maxWidth: 280 }} />
        <span className="grow"></span>
        <span className="sel-pill">{includedN} / {rows.length} included</span>
        <button className="btn ghost sm" onClick={() => setAll(false)}>Include all</button>
        <button className="btn ghost sm" onClick={() => setAll(true)}>Exclude all</button>
      </div>
      <div style={{ fontSize: 11.5, color: 'var(--ink-3)', marginBottom: 12 }}>{pmcResults.total.toLocaleString()} total matches · showing first {rows.length} for review. Exclusions here reduce what gets downloaded in step 3.</div>
      {visible.map((r, i) => {
        const ex = !!excluded[r.pmcid];
        return (
          <div className={'sr-row' + (ex ? ' excluded' : '')} key={r.pmcid || i}>
            <input className="sr-cb" type="checkbox" checked={!ex} onChange={() => setExcluded(m => ({ ...m, [r.pmcid]: !m[r.pmcid] }))} />
            <div className="sr-main">
              <div className="sr-title">{r.title || 'Untitled'}</div>
              <div className="sr-meta">
                <span className="pmcid">{r.pmcid}</span>
                {r.source && <span>{r.source}</span>}
                {r.pubdate && <span>{r.pubdate}</span>}
              </div>
            </div>
            <a className="sr-link" href={`https://www.ncbi.nlm.nih.gov/pmc/articles/${r.pmcid}/`} target="_blank" rel="noreferrer">Open ↗</a>
          </div>
        );
      })}
    </div>
  );
}

// ── Live log ──
function LogView({ logs, logEndRef, status }) {
  if (!logs.length) return (
    <div className="log-shell">
      <div className="log-bar"><span className="dot" style={{ background: '#3a4258' }}></span><span className="dot" style={{ background: '#444b63' }}></span><span className="lbl">pipeline.log — idle</span></div>
      <div className="log-body"><div className="log-line ll-log"><span className="lm">Waiting for pipeline activity… log output streams here in real time.</span></div></div>
    </div>
  );
  return (
    <div className="log-shell">
      <div className="log-bar">
        <span className="dot" style={{ background: status === 'running' ? '#5fd996' : '#444b63' }}></span>
        <span className="lbl">pipeline.log — {status} · {logs.length} lines</span>
      </div>
      <div className="log-body">
        {logs.map((l, i) => (
          <div key={i} className={'log-line ll-' + (l.level || 'info')}>
            <span className="lt">{l.time || ''}</span>
            <span className="lm">{l.message}</span>
          </div>
        ))}
        <div ref={logEndRef}></div>
      </div>
    </div>
  );
}

// ── Output files ──
function FilesView({ files, disconnected }) {
  if (!files || !files.length) return (
    <div className="empty">
      <div className="ei">📁</div>
      <div className="et">No output files yet</div>
      <div className="es">Datasets, summaries and logs generated by the pipeline will be listed here, each individually downloadable.</div>
    </div>
  );
  return (
    <div>
      <div className="files-head">
        <span style={{ fontSize: 12.5, color: 'var(--ink-2)', fontWeight: 600 }}>{files.length} files</span>
        <a className="dl-all" href={disconnected ? undefined : '/api/download-all'} onClick={disconnected ? (e)=>e.preventDefault() : undefined}>⤓ Download all (.zip)</a>
      </div>
      <div className="file-list">
        {files.map((f, i) => (
          <div className="file-item" key={i}>
            <span className="ficon">{fileExt(f.name)}</span>
            <span className="fname">{f.name}</span>
            <span className="fsize">{fmtSize(f.size)}</span>
            <a className="fdl" href={disconnected ? undefined : ('/api/download/' + encodeURIComponent(f.name))} onClick={disconnected ? (e)=>e.preventDefault() : undefined}>Download</a>
          </div>
        ))}
      </div>
    </div>
  );
}

// ── Review ──
const blankCorrection = () => ({
  subtask: 'general', pattern: '', error_description: '', fix_instruction: '',
  pmcid: '', field: '', example_wrong: '', example_right: '',
});

function ReviewView({ corrections, reload }) {
  const [articles, setArticles] = useState([]);
  const [sel, setSel] = useState(null);          // selected pmcid
  const [extraction, setExtraction] = useState(null);
  const [showForm, setShowForm] = useState(false);
  const [form, setForm] = useState(blankCorrection());

  // Load the reviewable article list (real extractions, demo fallback offline).
  useEffect(() => {
    api('/api/review').then(d => {
      const arts = (d && d.articles) || [];
      setArticles(arts);
      if (arts.length) loadArticle(arts[0].pmcid);
    });
  }, []);

  const loadArticle = async (pmcid) => {
    setSel(pmcid);
    const d = await api('/api/review/' + encodeURIComponent(pmcid));
    setExtraction((d && d.extraction) || null);
  };

  const flag = (field, subtask) => {
    setForm({ ...blankCorrection(), pmcid: sel || '', field: field || '', subtask: subtask || 'general' });
    setShowForm(true);
  };

  const submitCorrection = async () => {
    if (!form.pattern || !form.error_description || !form.fix_instruction) return;
    await api('/api/correction', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(form),
    }, () => ({}));
    setShowForm(false); setForm(blankCorrection());
    reload && reload();
  };

  const deleteCorrection = async (id) => {
    if (!id) return;
    await api('/api/correction/' + encodeURIComponent(id), { method: 'DELETE' }, () => ({}));
    reload && reload();
  };

  const renderValue = (v) => {
    if (v === null || v === undefined) return <span style={{ color: 'var(--ink-3)' }}>null</span>;
    if (typeof v === 'boolean') return <span style={{ color: v ? 'var(--ok)' : 'var(--err)', fontWeight: 600 }}>{String(v)}</span>;
    if (typeof v === 'object') return <pre style={{ margin: 0, fontSize: 11, whiteSpace: 'pre-wrap', fontFamily: 'var(--mono)', color: 'var(--ink)' }}>{JSON.stringify(v, null, 1)}</pre>;
    return String(v);
  };

  const fh = (extraction && extraction.family_history) || {};
  const sections = extraction ? [
    { label: 'Demographics', subtask: 'general', fields: [
      ['age_at_presentation', extraction.age_at_presentation],
      ['sex', extraction.sex],
    ]},
    { label: 'Temporal', subtask: 'temporal', fields: [
      ['age_at_onset', extraction.age_at_onset],
      ['symptom_duration_years', extraction.symptom_duration_years],
      ['diagnostic_delay_years', extraction.diagnostic_delay_years],
      ['_temporal_method', extraction._temporal_method],
    ]},
    { label: 'Family history', subtask: 'family_history', fields: [
      ['has_family_history', fh.has_family_history],
      ['family_members_detailed', fh.family_members_detailed],
      ['inheritance_pattern', fh.inheritance_pattern],
      ['_family_history_method', fh._family_history_method],
    ]},
    { label: 'Treatment responses', subtask: 'treatment', fields: [
      ['treatment_count', (extraction.treatment_responses || []).length],
      ['treatments', extraction.treatment_responses],
    ]},
  ] : [];

  const canSave = form.pattern && form.error_description && form.fix_instruction;
  const inputStyle = { marginTop: 5 };

  return (
    <div>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 14 }}>
        <div style={{ fontSize: 14, fontWeight: 650 }}>Review extractions &amp; submit corrections</div>
        <button className="btn primary sm" onClick={() => { if (showForm) { setShowForm(false); } else { flag('', 'general'); } }}>
          {showForm ? 'Cancel' : '＋ Add correction'}
        </button>
      </div>

      {showForm && (
        <div className="corr-form">
          <div className="cf-grid">
            <div className="field" style={{ marginBottom: 0 }}>
              <label className="field-label">Subtask</label>
              <select value={form.subtask} onChange={e => setForm({ ...form, subtask: e.target.value })} style={inputStyle}>
                <option value="temporal">Temporal reasoning</option>
                <option value="family_history">Family history</option>
                <option value="treatment">Treatment chains</option>
                <option value="general">General</option>
              </select>
            </div>
            <div className="field" style={{ marginBottom: 0 }}>
              <label className="field-label">Pattern slug</label>
              <input type="text" value={form.pattern} onChange={e => setForm({ ...form, pattern: e.target.value })} placeholder="e.g. possessive_family_ref" style={inputStyle} />
            </div>
            <div className="field" style={{ marginBottom: 0, gridColumn: '1 / -1' }}>
              <label className="field-label">What went wrong?</label>
              <input type="text" value={form.error_description} onChange={e => setForm({ ...form, error_description: e.target.value })} placeholder="e.g. Missed family history when relatives described possessively" style={inputStyle} />
            </div>
            <div className="field" style={{ marginBottom: 0, gridColumn: '1 / -1' }}>
              <label className="field-label">How to fix it (instruction for the LLM)</label>
              <input type="text" value={form.fix_instruction} onChange={e => setForm({ ...form, fix_instruction: e.target.value })} placeholder="e.g. Treat possessive references to relatives as family history" style={inputStyle} />
            </div>
            <div className="field" style={{ marginBottom: 0 }}>
              <label className="field-label">Example wrong output <span style={{ color: 'var(--ink-3)', fontWeight: 400 }}>(optional)</span></label>
              <input type="text" value={form.example_wrong} onChange={e => setForm({ ...form, example_wrong: e.target.value })} placeholder='{"has_family_history": null}' style={inputStyle} />
            </div>
            <div className="field" style={{ marginBottom: 0 }}>
              <label className="field-label">Example correct output <span style={{ color: 'var(--ink-3)', fontWeight: 400 }}>(optional)</span></label>
              <input type="text" value={form.example_right} onChange={e => setForm({ ...form, example_right: e.target.value })} placeholder='{"has_family_history": true}' style={inputStyle} />
            </div>
          </div>
          {(form.pmcid || form.field) && (
            <div className="hint" style={{ marginTop: 8 }}>Flagged from {form.pmcid || 'article'}{form.field ? ' · field ' + form.field : ''}</div>
          )}
          <button className="btn primary" onClick={submitCorrection} disabled={!canSave} style={{ marginTop: 12 }}>Save correction</button>
        </div>
      )}

      {corrections && corrections.length > 0 && (
        <div className="panel-card" style={{ marginTop: 0, marginBottom: 16 }}>
          <div className="pc-head"><h3>Saved corrections</h3><span className="pc-note">fed back into the LLM enhancer</span></div>
          <div className="pc-body">
            {corrections.map((c, i) => (
              <div className="corr-card" key={c.id || i}>
                <div>
                  <span className="cc-tag">{c.subtask}{c.pattern ? ' · ' + c.pattern : ''}</span>
                  <div style={{ marginTop: 5, color: 'var(--ink-2)' }}>{c.error_description}</div>
                  <div style={{ marginTop: 3, color: 'var(--ink)', fontWeight: 500 }}>→ {c.fix_instruction}</div>
                </div>
                <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-end', gap: 6, flexShrink: 0 }}>
                  {c.recurrence_count != null && <span style={{ fontSize: 11, color: 'var(--ink-3)', whiteSpace: 'nowrap' }}>seen ×{c.recurrence_count}</span>}
                  {c.id && <button className="btn ghost sm" onClick={() => deleteCorrection(c.id)}>Remove</button>}
                </div>
              </div>
            ))}
          </div>
        </div>
      )}

      <div className="review-grid">
        <div className="art-list">
          {articles.length === 0 && <div style={{ color: 'var(--ink-3)', fontSize: 12, padding: '10px 4px' }}>Run the pipeline first to populate reviewable articles.</div>}
          {articles.map((a) => (
            <div className={'art-item' + (sel === a.pmcid ? ' active' : '')} key={a.pmcid} onClick={() => loadArticle(a.pmcid)}>
              <div className="ai-id">{a.pmcid}</div>
              <div className="ai-meta">
                <span>{a.age != null ? a.age + 'y' : '—'} {a.sex ? a.sex[0].toUpperCase() : '?'}</span>
                <span>{a.symptom_count != null ? a.symptom_count : 0} sx</span>
                <span>{Math.round((a.completeness || 0) * 100)}%</span>
                {a.llm_enhanced && <span className="ai-llm">LLM</span>}
              </div>
            </div>
          ))}
        </div>
        {extraction ? (
          <div className="panel-card" style={{ marginTop: 0 }}>
            <div className="pc-head"><h3>{sel}</h3><span className="pc-note">{extraction._llm_enhanced ? 'rule-based + LLM' : 'rule-based'}</span></div>
            <div className="pc-body">
              {sections.map((sec) => (
                <div key={sec.label}>
                  <div className="sec-label">{sec.label}</div>
                  {sec.fields.map(([fname, fval]) => {
                    const isMeta = fname.startsWith('_');
                    return (
                      <div className="field-row" key={fname}>
                        <span className={'fr-name' + (isMeta ? ' meta' : '')}>{fname}</span>
                        <span className="fr-val">{renderValue(fval)}</span>
                        {!isMeta && <button className="flag-btn" onClick={() => flag(fname, sec.subtask)}>⚑ Flag</button>}
                      </div>
                    );
                  })}
                </div>
              ))}
              <div style={{ marginTop: 14, fontSize: 11.5, color: 'var(--ink-3)' }}>Flagging a field opens a correction form that is saved to <code style={{ fontFamily: 'var(--mono)' }}>corrections.json</code> and applied to future LLM passes.</div>
            </div>
          </div>
        ) : (
          <div className="empty" style={{ padding: '50px 24px' }}>
            <div className="ei">🔍</div>
            <div className="et">Select an article</div>
            <div className="es">Pick an article on the left to inspect its extracted demographics, temporal reasoning, family history and treatment chains.</div>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
