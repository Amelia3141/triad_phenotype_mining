<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phenotype Mining — Pipeline Console</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<style>
  :root {
    --bg: #f5f6f9;
    --panel: #ffffff;
    --panel-2: #fbfcfe;
    --ink: #161922;
    --ink-2: #565d6b;
    --ink-3: #899; 
    --ink-3: #8a909e;
    --line: #e7e9f0;
    --line-2: #eef0f5;
    --brand: #4b57d4;
    --brand-ink: #3742ad;
    --brand-tint: #edeefc;
    --brand-tint-2: #f6f6fe;
    --ok: #15803d;
    --ok-tint: #e7f5ec;
    --warn: #b45309;
    --warn-tint: #fbf0df;
    --err: #c0241f;
    --err-tint: #fae9e8;
    --ink-on-dark: #d6dae6;
    --dark: #11141f;
    --dark-2: #1a1e2c;
    --dark-line: #272c3d;
    --t1: #4b57d4;
    --t2: #0d9488;
    --t3: #c2410c;
    --t4: #9333ea;
    --t5: #ca8a04;
    --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", "Fira Code", Consolas, monospace;
    --r: 10px;
    --r-sm: 7px;
    --shadow: 0 1px 2px rgba(20,24,40,.04), 0 4px 16px rgba(20,24,40,.05);
    --shadow-pop: 0 8px 28px rgba(20,24,40,.14);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #d2d6e0; border-radius: 6px; border: 2px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-thumb:hover { background: #bcc2cf; background-clip: padding-box; }

  .app {
    display: grid;
    grid-template-columns: 230px minmax(380px, 460px) 1fr;
    grid-template-rows: 56px 1fr;
    height: 100vh;
    overflow: hidden;
  }

  /* ── Header ── */
  .topbar {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 0 18px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    z-index: 30;
  }
  .brand-mark {
    width: 26px; height: 26px; border-radius: 7px;
    background: linear-gradient(135deg, var(--t1), var(--t2));
    display: grid; place-items: center; flex-shrink: 0;
    position: relative;
  }
  .brand-mark::before, .brand-mark::after {
    content: ""; position: absolute; border-radius: 50%;
    border: 1.6px solid rgba(255,255,255,.92);
  }
  .brand-mark::before { width: 12px; height: 12px; left: 5px; top: 7px; }
  .brand-mark::after { width: 12px; height: 12px; right: 5px; top: 7px; }
  .brand-dot { width: 12px; height: 12px; border-radius: 50%; border: 1.6px solid rgba(255,255,255,.92); position: absolute; left: 50%; transform: translateX(-50%); bottom: 5px; }
  .topbar .titles { display: flex; flex-direction: column; line-height: 1.2; }
  .topbar h1 { font-size: 14.5px; font-weight: 650; letter-spacing: -0.2px; }
  .topbar .sub { font-size: 11.5px; color: var(--ink-3); font-weight: 500; }

  .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 14px; }

  .global-progress {
    width: 200px;
    display: flex; flex-direction: column; gap: 3px;
  }
  .global-progress .gp-meta { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--ink-3); font-family: var(--mono); }
  .gp-track { height: 5px; background: var(--line-2); border-radius: 4px; overflow: hidden; }
  .gp-fill { height: 100%; background: var(--brand); border-radius: 4px; transition: width .4s ease; }
  .gp-fill.indet {
    width: 35% !important;
    background: linear-gradient(90deg, transparent, var(--brand), transparent);
    animation: slide 1.1s infinite;
  }
  @keyframes slide { 0% { margin-left: -35%; } 100% { margin-left: 100%; } }

  .status-pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 11px 5px 9px; border-radius: 20px;
    font-size: 11.5px; font-weight: 600; letter-spacing: .2px;
  }
  .status-pill .ico { width: 7px; height: 7px; border-radius: 50%; }
  .sp-idle { background: var(--line-2); color: var(--ink-2); }
  .sp-idle .ico { background: var(--ink-3); }
  .sp-running { background: var(--brand-tint); color: var(--brand-ink); }
  .sp-running .ico { background: var(--brand); animation: blink 1.1s infinite; }
  .sp-done { background: var(--ok-tint); color: var(--ok); }
  .sp-done .ico { background: var(--ok); }
  .sp-error { background: var(--err-tint); color: var(--err); }
  .sp-error .ico { background: var(--err); }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .3; } }

  /* ── Runs rail ── */
  .runs-rail {
    background: var(--panel);
    border-right: 1px solid var(--line);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .rail-head { padding: 14px 14px 8px; display: flex; align-items: center; justify-content: space-between; }
  .rail-head .lbl { font-size: 10.5px; font-weight: 700; letter-spacing: .9px; text-transform: uppercase; color: var(--ink-3); }
  .new-run-btn {
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    border-radius: 7px; padding: 4px 9px; font-size: 12px; font-weight: 600; cursor: pointer;
    display: inline-flex; align-items: center; gap: 5px; transition: all .12s;
  }
  .new-run-btn:hover { background: var(--brand-tint); border-color: var(--brand); color: var(--brand-ink); }
  .runs-list { flex: 1; overflow-y: auto; padding: 4px 8px 12px; display: flex; flex-direction: column; gap: 4px; }
  .run-card {
    border: 1px solid var(--line); background: var(--panel-2); border-radius: 9px;
    padding: 9px 11px; cursor: pointer; transition: all .12s; position: relative;
  }
  .run-card:hover { border-color: #d3d7e3; background: #fff; }
  .run-card.active { border-color: var(--brand); background: var(--brand-tint-2); box-shadow: inset 2px 0 0 var(--brand); }
  .run-card .rc-title { font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .run-card .rc-meta { font-size: 10.5px; color: var(--ink-3); margin-top: 2px; font-family: var(--mono); }
  .run-card .rc-stat { font-size: 11px; color: var(--ink-2); margin-top: 4px; display: flex; gap: 8px; }
  .run-card .rc-del { position: absolute; top: 7px; right: 7px; width: 18px; height: 18px; border-radius: 5px; border: none; background: transparent; color: var(--ink-3); cursor: pointer; font-size: 14px; line-height: 1; opacity: 0; display: grid; place-items: center; }
  .run-card:hover .rc-del { opacity: 1; }
  .run-card .rc-del:hover { background: var(--err-tint); color: var(--err); }
  .rail-empty { color: var(--ink-3); font-size: 12px; padding: 16px 12px; text-align: center; line-height: 1.5; }

  /* ── Control column (stepper) ── */
  .control-col {
    background: var(--panel);
    border-right: 1px solid var(--line);
    overflow-y: auto;
    padding: 16px 16px 40px;
  }
  .stepper { position: relative; }
  .step {
    position: relative;
    padding-left: 38px;
    padding-bottom: 14px;
  }
  .step:last-child { padding-bottom: 0; }
  .step .rail-line {
    position: absolute; left: 13px; top: 28px; bottom: -2px; width: 2px; background: var(--line);
  }
  .step.done .rail-line { background: var(--ok); }
  .step .node {
    position: absolute; left: 0; top: 0; width: 28px; height: 28px; border-radius: 50%;
    display: grid; place-items: center; font-size: 12px; font-weight: 700;
    background: var(--panel); border: 2px solid var(--line); color: var(--ink-3);
    z-index: 2; transition: all .15s;
  }
  .step.active .node { border-color: var(--brand); color: var(--brand); background: var(--brand-tint); }
  .step.done .node { border-color: var(--ok); background: var(--ok); color: #fff; }
  .step.locked .node { background: var(--panel-2); }

  .step-card {
    border: 1px solid var(--line); border-radius: var(--r); background: var(--panel);
    overflow: hidden; transition: border-color .15s, box-shadow .15s;
  }
  .step.active .step-card { border-color: #cfd4e6; box-shadow: var(--shadow); }
  .step.locked .step-card { background: var(--panel-2); opacity: .72; }
  .step-header {
    display: flex; align-items: center; gap: 8px;
    padding: 11px 13px; cursor: pointer; user-select: none;
  }
  .step.locked .step-header { cursor: not-allowed; }
  .step-header .st-title { font-size: 13.5px; font-weight: 650; letter-spacing: -.1px; }
  .step-header .st-sum { font-size: 11.5px; color: var(--ink-3); margin-left: auto; font-family: var(--mono); white-space: nowrap; max-width: 150px; overflow: hidden; text-overflow: ellipsis; }
  .step-header .chev { margin-left: 8px; color: var(--ink-3); transition: transform .18s; font-size: 11px; }
  .step.active .step-header .chev { transform: rotate(90deg); }
  .step.done .step-header .st-title { color: var(--ink-2); }
  .badge-done { font-size: 10px; font-weight: 700; color: var(--ok); background: var(--ok-tint); padding: 2px 7px; border-radius: 10px; letter-spacing: .3px; }

  .step-body { padding: 0 13px 14px; }
  .step-body.collapsed { display: none; }

  label.field-label { display: block; font-size: 11.5px; color: var(--ink-2); margin-bottom: 5px; font-weight: 600; }
  .field { margin-bottom: 13px; }
  .hint { font-size: 11px; color: var(--ink-3); margin-top: 5px; line-height: 1.45; }

  input[type=text], input[type=password], input[type=number], textarea, select {
    width: 100%; background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--r-sm); color: var(--ink); padding: 8px 10px;
    font-size: 13px; font-family: var(--sans); outline: none; transition: all .15s;
  }
  input[type=number].count-input { width: 88px; flex: none; text-align: right; font-family: var(--mono); font-weight: 600; padding: 7px 9px; }
  textarea { resize: vertical; min-height: 56px; font-family: var(--mono); font-size: 12px; line-height: 1.5; }
  input:focus, textarea:focus, select:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-tint); }
  input:disabled, textarea:disabled, select:disabled { background: var(--panel-2); color: var(--ink-3); cursor: not-allowed; }

  /* chips */
  .chip-input {
    display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
    border: 1px solid var(--line); border-radius: var(--r-sm); padding: 7px 8px;
    background: var(--panel); transition: all .15s; cursor: text; min-height: 38px;
  }
  .chip-input.focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-tint); }
  .chip-input.disabled { background: var(--panel-2); cursor: not-allowed; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--brand-tint); color: var(--brand-ink); border-radius: 6px;
    padding: 3px 4px 3px 9px; font-size: 12px; font-weight: 600; max-width: 100%;
  }
  .chip .ct { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chip.comorb { background: #eaf3f1; color: #0c6b60; }
  .chip .x { border: none; background: transparent; color: inherit; cursor: pointer; font-size: 14px; line-height: 1; padding: 0 3px; border-radius: 4px; opacity: .65; }
  .chip .x:hover { opacity: 1; background: rgba(0,0,0,.07); }
  .chip-input input { border: none; outline: none; box-shadow: none; flex: 1; min-width: 90px; padding: 2px; font-size: 12.5px; background: transparent; }
  .chip-input input:focus { box-shadow: none; }

  .preset-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .preset {
    border: 1px dashed var(--line); background: var(--panel-2); color: var(--ink-2);
    border-radius: 20px; padding: 4px 11px; font-size: 11.5px; font-weight: 600; cursor: pointer; transition: all .12s;
  }
  .preset:hover { border-color: var(--brand); color: var(--brand-ink); background: var(--brand-tint); border-style: solid; }

  .checkbox-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px 12px; margin-top: 2px; }
  .cbx { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--ink); cursor: pointer; font-weight: 500; padding: 3px 0; }
  .cbx input { width: auto; }
  .cbx.disabled { color: var(--ink-3); cursor: not-allowed; }

  .switch-row { display: flex; align-items: center; gap: 10px; padding: 9px 11px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--panel-2); }
  .switch { position: relative; width: 38px; height: 22px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch .track { position: absolute; inset: 0; background: #cfd3df; border-radius: 20px; transition: .18s; cursor: pointer; }
  .switch .track::before { content: ""; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .18s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
  .switch input:checked + .track { background: var(--brand); }
  .switch input:checked + .track::before { transform: translateX(16px); }
  .switch-row .sw-label { font-size: 12.5px; font-weight: 600; }
  .switch-row .sw-sub { font-size: 11px; color: var(--ink-3); }

  .slider-row { display: flex; align-items: center; gap: 12px; }
  input[type=range] { flex: 1; -webkit-appearance: none; appearance: none; height: 5px; background: var(--line); border-radius: 4px; padding: 0; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 17px; height: 17px; border-radius: 50%; background: var(--brand); cursor: pointer; border: 2px solid #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
  input[type=range]:disabled::-webkit-slider-thumb { background: var(--ink-3); }
  .slider-val { font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--brand-ink); min-width: 42px; text-align: right; }

  .btn {
    width: 100%; padding: 9px 14px; border: none; border-radius: var(--r-sm);
    font-size: 13px; font-weight: 650; cursor: pointer; transition: all .14s;
    font-family: var(--sans); display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  }
  .btn.primary { background: var(--brand); color: #fff; box-shadow: 0 1px 2px rgba(75,87,212,.3); }
  .btn.primary:hover:not(:disabled) { background: var(--brand-ink); }
  .btn.primary:disabled { background: #c7cbe6; cursor: not-allowed; box-shadow: none; }
  .btn.ghost { background: var(--panel); color: var(--ink); border: 1px solid var(--line); }
  .btn.ghost:hover:not(:disabled) { background: var(--panel-2); border-color: #d3d7e3; }
  .btn.sm { width: auto; padding: 5px 11px; font-size: 11.5px; }

  .gate-hint {
    display: flex; align-items: center; gap: 7px; margin-top: 9px;
    font-size: 11.5px; color: var(--warn); background: var(--warn-tint);
    padding: 7px 10px; border-radius: var(--r-sm); font-weight: 500;
  }
  .gate-hint.ready { color: var(--ok); background: var(--ok-tint); }

  /* in-step progress */
  .step-progress { margin-top: 11px; padding: 10px 11px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--panel-2); }
  .step-progress .sp-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .step-progress .sp-phase { font-size: 11.5px; font-weight: 600; color: var(--ink); }
  .step-progress .sp-count { font-size: 11px; font-family: var(--mono); color: var(--ink-2); }
  .step-progress .sp-track { height: 6px; background: var(--line-2); border-radius: 4px; overflow: hidden; }
  .step-progress .sp-fill { height: 100%; background: var(--brand); border-radius: 4px; transition: width .4s ease; }
  .step-progress .sp-eta { font-size: 10.5px; color: var(--ink-3); margin-top: 5px; font-family: var(--mono); }

  /* search preview list (in step) */
  .search-summary { margin-top: 12px; border: 1px solid var(--line); border-radius: var(--r-sm); overflow: hidden; }
  .search-summary .ss-head { padding: 9px 11px; background: var(--ok-tint); color: var(--ok); font-size: 12px; font-weight: 650; display: flex; align-items: center; gap: 7px; }
  .search-summary .ss-sub { font-weight: 500; color: var(--ink-2); margin-left: auto; font-family: var(--mono); font-size: 11px; }

  /* ── Output column ── */
  .output-col { display: flex; flex-direction: column; overflow: hidden; background: var(--bg); }
  .tabbar { display: flex; align-items: center; gap: 2px; padding: 0 14px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .tab {
    padding: 13px 14px 12px; font-size: 12.5px; font-weight: 600; color: var(--ink-3);
    cursor: pointer; border-bottom: 2px solid transparent; transition: all .12s; display: flex; align-items: center; gap: 7px;
  }
  .tab:hover { color: var(--ink); }
  .tab.active { color: var(--brand-ink); border-bottom-color: var(--brand); }
  .tab .cnt { font-size: 10.5px; background: var(--line-2); color: var(--ink-2); border-radius: 9px; padding: 1px 7px; font-family: var(--mono); font-weight: 600; }
  .tab.active .cnt { background: var(--brand-tint); color: var(--brand-ink); }
  .tab-tools { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .tab-content { flex: 1; overflow-y: auto; padding: 18px; }

  /* log (engine room) */
  .log-shell { background: var(--dark); border-radius: var(--r); border: 1px solid var(--dark-line); overflow: hidden; height: 100%; display: flex; flex-direction: column; }
  .log-shell .log-bar { padding: 8px 13px; border-bottom: 1px solid var(--dark-line); display: flex; align-items: center; gap: 8px; }
  .log-shell .log-bar .dot { width: 9px; height: 9px; border-radius: 50%; }
  .log-shell .log-bar .lbl { color: #9aa1b5; font-size: 11px; font-weight: 600; font-family: var(--mono); letter-spacing: .3px; }
  .log-body { flex: 1; overflow-y: auto; padding: 12px 14px; font-family: var(--mono); font-size: 12px; line-height: 1.7; }
  .log-body::-webkit-scrollbar-thumb { background: #333a4f; }
  .log-line { white-space: pre-wrap; word-break: break-word; display: flex; gap: 10px; }
  .log-line .lt { color: #5a627a; flex-shrink: 0; user-select: none; }
  .log-line .lm { flex: 1; }
  .ll-info .lm { color: var(--ink-on-dark); }
  .ll-success .lm { color: #5fd996; }
  .ll-warn .lm { color: #f0c548; }
  .ll-error .lm { color: #f78b85; }
  .ll-log .lm { color: #707892; font-size: 11px; }

  /* results */
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 8px; }
  .stat-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 15px; box-shadow: var(--shadow); }
  .stat-card .sl { font-size: 11px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .5px; font-weight: 600; }
  .stat-card .sv { font-size: 27px; font-weight: 700; color: var(--ink); margin-top: 5px; letter-spacing: -.5px; line-height: 1.1; }
  .stat-card .sv.brand { color: var(--brand-ink); }
  .stat-card .sd { font-size: 11.5px; color: var(--ink-3); margin-top: 3px; }
  .stat-card .spark { display: flex; gap: 4px; align-items: flex-end; margin-top: 8px; height: 22px; }
  .stat-card .spark > div { flex: 1; background: var(--brand-tint); border-radius: 2px 2px 0 0; min-height: 2px; }

  .panel-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); margin-top: 16px; overflow: hidden; }
  .panel-card .pc-head { padding: 13px 16px; border-bottom: 1px solid var(--line-2); display: flex; align-items: center; gap: 9px; }
  .panel-card .pc-head h3 { font-size: 13.5px; font-weight: 650; }
  .panel-card .pc-head .pc-note { font-size: 11.5px; color: var(--ink-3); margin-left: auto; }
  .panel-card .pc-body { padding: 14px 16px; }

  .bars { display: flex; flex-direction: column; gap: 7px; }
  .bar-row { display: flex; align-items: center; gap: 10px; font-size: 12.5px; }
  .bar-label { width: 180px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-shrink: 0; text-transform: capitalize; }
  .bar-track { flex: 1; height: 20px; background: var(--line-2); border-radius: 5px; overflow: hidden; position: relative; }
  .bar-fill { height: 100%; border-radius: 5px; transition: width .6s cubic-bezier(.2,.7,.2,1); min-width: 2px; }
  .bar-count { width: 38px; text-align: right; font-family: var(--mono); font-size: 12px; color: var(--ink); flex-shrink: 0; font-weight: 600; }

  /* triad / co-occurrence */
  .triad-wrap { display: flex; gap: 22px; align-items: center; flex-wrap: wrap; }
  .venn { position: relative; width: 260px; height: 220px; flex-shrink: 0; }
  .venn .circle { position: absolute; width: 150px; height: 150px; border-radius: 50%; mix-blend-mode: multiply; opacity: .55; }
  .venn .lbl { position: absolute; font-size: 12px; font-weight: 700; }
  .venn .cnt-bubble { position: absolute; font-family: var(--mono); font-weight: 700; font-size: 13px; transform: translate(-50%,-50%); color: var(--ink); }
  .cooc-legend { display: flex; flex-direction: column; gap: 9px; flex: 1; min-width: 200px; }
  .cooc-item { display: flex; align-items: center; gap: 10px; font-size: 12.5px; }
  .cooc-item .sw { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }
  .cooc-item .nm { color: var(--ink-2); }
  .cooc-item .vv { margin-left: auto; font-family: var(--mono); font-weight: 700; color: var(--ink); }
  .cooc-item .vv small { color: var(--ink-3); font-weight: 500; }

  /* files */
  .files-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  .file-list { display: flex; flex-direction: column; gap: 7px; }
  .file-item { display: flex; align-items: center; gap: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 13px; box-shadow: var(--shadow); }
  .file-item .ficon { width: 30px; height: 30px; border-radius: 7px; background: var(--brand-tint); color: var(--brand-ink); display: grid; place-items: center; font-size: 10px; font-weight: 700; font-family: var(--mono); flex-shrink: 0; }
  .file-item .fname { font-family: var(--mono); font-size: 12.5px; color: var(--ink); flex: 1; }
  .file-item .fsize { color: var(--ink-3); font-family: var(--mono); font-size: 11.5px; }
  .file-item .fdl { color: var(--brand); text-decoration: none; font-weight: 650; font-size: 12px; padding: 5px 11px; border-radius: 6px; border: 1px solid var(--line); transition: all .12s; }
  .file-item .fdl:hover { background: var(--brand-tint); border-color: var(--brand); }
  a.dl-all { display: inline-flex; align-items: center; gap: 7px; padding: 9px 15px; border-radius: var(--r-sm); background: var(--brand); color: #fff; text-decoration: none; font-weight: 650; font-size: 13px; box-shadow: 0 1px 2px rgba(75,87,212,.3); }
  a.dl-all:hover { background: var(--brand-ink); }

  /* search results tab */
  .sr-toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
  .sr-toolbar .grow { flex: 1; }
  .sel-pill { font-size: 12px; color: var(--ink-2); font-weight: 600; }
  .sr-row { display: flex; align-items: flex-start; gap: 12px; padding: 11px 13px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-sm); margin-bottom: 7px; box-shadow: var(--shadow); }
  .sr-row.excluded { opacity: .5; }
  .sr-row .sr-cb { margin-top: 2px; }
  .sr-row .sr-main { flex: 1; min-width: 0; }
  .sr-row .sr-title { font-size: 13px; font-weight: 600; color: var(--ink); line-height: 1.4; }
  .sr-row .sr-meta { font-size: 11.5px; color: var(--ink-3); margin-top: 3px; display: flex; gap: 12px; flex-wrap: wrap; }
  .sr-row .sr-meta .pmcid { font-family: var(--mono); color: var(--brand-ink); font-weight: 600; }
  .sr-row a.sr-link { font-size: 11.5px; color: var(--brand); text-decoration: none; font-weight: 600; flex-shrink: 0; }
  .sr-row a.sr-link:hover { text-decoration: underline; }

  /* review */
  .review-grid { display: grid; grid-template-columns: 260px 1fr; gap: 16px; }
  .art-list { display: flex; flex-direction: column; gap: 4px; max-height: calc(100vh - 230px); overflow-y: auto; padding-right: 4px; }
  .art-item { padding: 9px 11px; border: 1px solid var(--line); border-radius: var(--r-sm); cursor: pointer; background: var(--panel); transition: all .12s; }
  .art-item:hover { border-color: #d3d7e3; }
  .art-item.active { border-color: var(--brand); background: var(--brand-tint-2); }
  .art-item .ai-id { font-family: var(--mono); font-weight: 650; font-size: 12px; }
  .art-item .ai-meta { font-size: 11px; color: var(--ink-3); margin-top: 2px; display: flex; gap: 9px; }
  .art-item .ai-llm { color: var(--brand-ink); font-weight: 600; }
  .field-row { display: flex; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line-2); font-size: 12.5px; align-items: flex-start; }
  .field-row .fr-name { width: 190px; flex-shrink: 0; font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); }
  .field-row .fr-name.meta { color: var(--brand-ink); }
  .field-row .fr-val { flex: 1; word-break: break-word; }
  .sec-label { font-size: 10.5px; font-weight: 700; color: var(--ink-3); text-transform: uppercase; letter-spacing: .6px; margin: 14px 0 4px; }
  .flag-btn { border: 1px solid var(--line); background: var(--panel); color: var(--ink-2); border-radius: 5px; padding: 2px 8px; font-size: 10.5px; font-weight: 600; cursor: pointer; flex-shrink: 0; }
  .flag-btn:hover { background: var(--warn-tint); border-color: var(--warn); color: var(--warn); }
  .corr-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 12px; margin-bottom: 7px; font-size: 12px; display: flex; justify-content: space-between; gap: 10px; box-shadow: var(--shadow); }
  .corr-card .cc-tag { font-family: var(--mono); font-size: 10.5px; font-weight: 700; color: var(--brand-ink); background: var(--brand-tint); padding: 1px 7px; border-radius: 9px; }
  .corr-form { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 15px; margin-bottom: 16px; box-shadow: var(--shadow); }
  .corr-form .cf-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }

  .empty { text-align: center; color: var(--ink-3); padding: 70px 24px; }
  .empty .ei { width: 46px; height: 46px; border-radius: 13px; background: var(--panel); border: 1px solid var(--line); display: grid; place-items: center; margin: 0 auto 14px; font-size: 22px; box-shadow: var(--shadow); }
  .empty .et { font-size: 14px; font-weight: 600; color: var(--ink-2); }
  .empty .es { font-size: 12.5px; margin-top: 4px; max-width: 320px; margin-left: auto; margin-right: auto; line-height: 1.5; }

  .demo-banner { display: flex; align-items: center; gap: 8px; background: var(--warn-tint); color: var(--warn); font-size: 11.5px; font-weight: 600; padding: 6px 14px; border-bottom: 1px solid #f0dcb8; }
  .demo-banner .x { margin-left: auto; cursor: pointer; border: none; background: transparent; color: inherit; font-weight: 700; font-size: 13px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

const PUB_TYPE_OPTIONS = [
  { id: 'case_reports', label: 'Case reports' },
  { id: 'review', label: 'Reviews' },
  { id: 'systematic_review', label: 'Systematic reviews' },
  { id: 'clinical_trial', label: 'Clinical trials' },
  { id: 'meta_analysis', label: 'Meta-analyses' },
  { id: 'observational', label: 'Observational studies' },
  { id: 'comparative_study', label: 'Comparative studies' },
];

const PRESETS = [
  { label: 'EDS / POTS / MCAS triad', diseases: ['Ehlers-Danlos syndrome', 'postural orthostatic tachycardia syndrome', 'mast cell activation syndrome'] },
  { label: 'Dysautonomia spectrum', diseases: ['dysautonomia', 'orthostatic intolerance', 'vasovagal syncope'] },
  { label: 'Hypermobility', diseases: ['hypermobility spectrum disorder', 'joint hypermobility syndrome', 'hypermobile Ehlers-Danlos syndrome'] },
];

const TRIAD_COLORS = ['var(--t1)', 'var(--t2)', 'var(--t3)', 'var(--t4)', 'var(--t5)'];

const fmtSize = (b) => b == null ? '' : b < 1024 ? b + ' B' : b < 1048576 ? (b/1024).toFixed(1) + ' KB' : (b/1048576).toFixed(1) + ' MB';
const fileExt = (n) => { const p = (n||'').split('.'); return (p.length > 1 ? p.pop() : '·').toUpperCase().slice(0,4); };

// ── API helper. On any failure the backend is treated as unreachable and we
// surface that explicitly — the UI NEVER fabricates data to fill the gap. ──
let BACKEND_DOWN = { on: false };
async function api(url, opts) {
  try {
    const r = await fetch(url, opts);
    if (!r.ok) throw new Error('http ' + r.status);
    const ct = r.headers.get('content-type') || '';
    BACKEND_DOWN.on = false;
    return ct.includes('json') ? await r.json() : await r.text();
  } catch (e) {
    BACKEND_DOWN.on = true;
    return null;
  }
}

// ── Run history (localStorage) ──
const RUNS_KEY = 'phenotype_runs_v1';
const loadRuns = () => { try { return JSON.parse(localStorage.getItem(RUNS_KEY)) || []; } catch { return []; } };
const saveRuns = (runs) => { try { localStorage.setItem(RUNS_KEY, JSON.stringify(runs.slice(0, 40))); } catch {} };

function App() {
  // workflow / pipeline
  const [status, setStatus] = useState('idle');
  const [progress, setProgress] = useState('');
  const [logs, setLogs] = useState([]);
  const [activeStep, setActiveStep] = useState(1);
  const [activeTab, setActiveTab] = useState('results');
  const [disconnected, setDisconnected] = useState(false);   // backend not reachable

  // inputs
  const [diseases, setDiseases] = useState([]);
  const [comorbidities, setComorbidities] = useState([]);
  const [searchTerms, setSearchTerms] = useState([]);   // MONDO-resolved synonyms from the backend
  const [pmcQuery, setPmcQuery] = useState('');
  const [advancedQuery, setAdvancedQuery] = useState(false);
  const [pubTypes, setPubTypes] = useState({ case_reports: true });
  const [maxArticles, setMaxArticles] = useState(50);
  const [maxDownload, setMaxDownload] = useState(50);

  // llm
  const [enableLLM, setEnableLLM] = useState(false);
  const [llmProvider, setLlmProvider] = useState('anthropic');
  const [llmModel, setLlmModel] = useState('');
  const [llmApiKey, setLlmApiKey] = useState('');
  const [validateOntology, setValidateOntology] = useState(true);   // RxNorm/Mondo precision filter

  // pipeline outputs
  const [configReady, setConfigReady] = useState(false);
  const [pmcResults, setPmcResults] = useState(null);
  const [excluded, setExcluded] = useState({});      // pmcid -> true means excluded
  const [articlesCount, setArticlesCount] = useState(0);
  const [results, setResults] = useState(null);
  const [outputFiles, setOutputFiles] = useState([]);
  const [corrections, setCorrections] = useState([]);

  // progress meter (parsed from logs)
  const [meter, setMeter] = useState({ phase: '', cur: 0, total: 0, eta: null });

  // runs
  const [runs, setRuns] = useState(loadRuns);
  const [activeRunId, setActiveRunId] = useState(null);

  const logEndRef = useRef(null);
  const isRunning = status === 'running';

  // SSE log stream + live progress parsing
  useEffect(() => {
    let es;
    try {
      es = new EventSource('/api/stream-logs');
      es.onmessage = (ev) => {
        try {
          const msg = JSON.parse(ev.data);
          setLogs(prev => [...prev, msg]);
          parseProgress(msg.message);
        } catch {}
      };
      es.onerror = () => {};   // status poll is authoritative for connection state
    } catch {}
    return () => es && es.close();
  }, []);

  const parseProgress = (m) => {
    if (!m) return;
    let phase = null;
    if (/Searching P(MC|ubMed)/i.test(m)) phase = 'Searching PubMed Central';
    else if (/Downloading \d+ articles/i.test(m)) phase = 'Downloading full text';
    else if (/Running extraction/i.test(m)) phase = 'Extracting phenotypes';
    else if (/Resolving .*MONDO/i.test(m)) phase = 'Resolving ontology';
    else if (/Building dataset/i.test(m)) phase = 'Building datasets';
    const pm = m.match(/Progress:\s*(\d+)\s*\/\s*(\d+)/);
    const em = m.match(/ETA\s*~?\s*(\d+)\s*s/);
    setMeter(prev => ({
      phase: phase || prev.phase,
      cur: pm ? parseInt(pm[1]) : (phase ? 0 : prev.cur),
      total: pm ? parseInt(pm[2]) : (phase ? 0 : prev.total),
      eta: em ? parseInt(em[1]) : (pm ? prev.eta : null),
    }));
  };

  // status polling — also the single source of truth for whether the backend
  // is reachable. A failed poll flips to the disconnected state; a successful
  // one clears it. No data is ever invented when disconnected.
  useEffect(() => {
    const tick = async () => {
      const d = await api('/api/status');
      if (!d) { setDisconnected(true); return; }
      setDisconnected(false);
      setStatus(s => d.status || s);
      setProgress(d.progress || '');
      setConfigReady(!!d.config_ready);
      setArticlesCount(d.articles_count || 0);
    };
    tick();
    const iv = setInterval(tick, 1500);
    return () => clearInterval(iv);
  }, []);

  useEffect(() => { logEndRef.current && logEndRef.current.scrollIntoView({ behavior: 'smooth', block: 'end' }); }, [logs]);

  // Rehydrate from the backend on load so a page refresh (or reopening the app
  // mid-workflow) restores the search results, results and output files instead
  // of showing empty tabs while the server still holds the data.
  useEffect(() => {
    (async () => {
      const d = await api('/api/pmc-results');
      if (d && d.total > 0) setPmcResults(d);
      const rr = await api('/api/results');
      if (rr && rr.count > 0) {
        setResults(rr);
        const fr = await api('/api/output-files');
        setOutputFiles((fr && fr.files) || []);
      }
    })();
  }, []);

  // auto-build the query from the conditions (unless the user took manual control).
  // Prefer MONDO-resolved synonyms once the config is built (richer recall);
  // fall back to the raw disease chips before then. Topic terms ONLY — the
  // backend (build_pubmed_term) appends the publication-type and PMC
  // open-access filters from the checkboxes, so baking them in here would
  // double-filter the search.
  useEffect(() => {
    if (advancedQuery) return;
    const terms = (searchTerms && searchTerms.length) ? searchTerms : diseases;
    if (!terms.length) { setPmcQuery(''); return; }
    const q = terms.map(d => `"${d}"`).join(' OR ');
    setPmcQuery(`(${q})`);
  }, [diseases, searchTerms, advancedQuery]);

  // ── step gating ──
  const stepDone = {
    1: configReady,
    2: !!(pmcResults && pmcResults.total > 0),
    3: articlesCount > 0,
    4: !!(results && results.count > 0),
  };
  const stepLocked = { 1: false, 2: !configReady, 3: !(pmcResults && pmcResults.total > 0), 4: !(articlesCount > 0) };

  const goStep = (n) => { if (!stepLocked[n]) setActiveStep(n); };

  // ── actions ──
  const generateConfig = async () => {
    if (!diseases.length) return;
    setLogs([]); setSearchTerms([]); setMeter({ phase: 'Resolving ontology', cur: 0, total: 0, eta: null });
    const r = await api('/api/generate-config', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ diseases, comorbidities }),
    });
    if (!r) return;   // backend unreachable — disconnected banner will show

    // Poll for config readiness, then pull MONDO synonyms into the query and
    // advance to step 2.
    let tries = 0;
    const poll = setInterval(async () => {
      tries++;
      const s = await api('/api/status');
      if (s && s.config_ready) {
        clearInterval(poll);
        if (s.search_terms && s.search_terms.length) setSearchTerms(s.search_terms);
        setConfigReady(true);
        setActiveStep(2);
      } else if (!s || s.status === 'error' || tries > 40) {
        clearInterval(poll);
      }
    }, 1500);
  };

  const searchPMC = async () => {
    if (!pmcQuery.trim()) return;
    const sel = Object.keys(pubTypes).filter(k => pubTypes[k]);
    setExcluded({});
    setPmcResults(null);   // clear any prior search before the new one lands
    const r = await api('/api/search-pmc', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query: pmcQuery, max_results: maxArticles, pub_types: sel }),
    });
    if (!r) return;
    // The search runs in the background (status='running'). Wait until it
    // leaves 'running' before reading /api/pmc-results — reading mid-search
    // could pick up an empty preview.
    let tries = 0;
    const poll = setInterval(async () => {
      tries++;
      const sd = await api('/api/status');
      if (!sd) { clearInterval(poll); return; }
      if (sd.status === 'running' && tries < 80) return;   // still searching
      clearInterval(poll);
      const d = await api('/api/pmc-results');
      if (d) {
        setPmcResults(d);
        if (d.total > 0) { setActiveStep(3); setActiveTab('search'); }
      }
    }, 1500);
  };

  const downloadArticles = async () => {
    setMeter({ phase: 'Downloading full text', cur: 0, total: includedCount(), eta: null });
    const exclude = Object.keys(excluded).filter(k => excluded[k]);
    await api(`/api/download-articles?max_articles=${maxDownload}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ exclude }),
    });
  };

  const runPipeline = async () => {
    setResults(null);
    setMeter({ phase: 'Extracting phenotypes', cur: 0, total: articlesCount, eta: null });
    const r = await api('/api/run-pipeline', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ enable_llm: enableLLM, llm_provider: llmProvider, llm_model: llmModel, llm_api_key: llmApiKey, validate_ontology: validateOntology }),
    });
    if (!r) return;
    const poll = setInterval(async () => {
      const sd = await api('/api/status');
      if (sd && sd.status === 'done') {
        clearInterval(poll);
        const rr = await api('/api/results'); setResults(rr);
        const fr = await api('/api/output-files'); setOutputFiles((fr && fr.files) || []);
        setActiveTab('results'); commitRun(rr);
      } else if (!sd || sd.status === 'error') {
        clearInterval(poll);
      }
    }, 2000);
  };

  const includedCount = () => {
    const dl = (pmcResults && pmcResults.downloadable) || 0;
    const ex = Object.keys(excluded).filter(k => excluded[k]).length;
    const avail = Math.max(0, dl - ex);
    return maxDownload === 0 ? avail : Math.min(maxDownload, avail);  // 0 = all retrieved
  };

  // ── runs ──
  const commitRun = async (res) => {
    // Label the run from the backend's ACTUAL configured conditions (the disease
    // the extraction config was built for), not the local chip state — which can
    // be stale (e.g. after loading a previous run or editing the raw query).
    const sd = await api('/api/status');
    const names = (sd && sd.conditions && sd.conditions.length) ? sd.conditions
                : (diseases.length ? diseases : []);
    const run = {
      id: 'run_' + Date.now(),
      title: names.length ? names[0] + (names.length > 1 ? ` +${names.length - 1}` : '') : 'Untitled run',
      diseases: names, ts: Date.now(),
      corpus: articlesCount || (res && res.count) || 0,
      extracted: (res && res.count) || 0,
    };
    setRuns(prev => { const next = [run, ...prev]; saveRuns(next); return next; });
    setActiveRunId(run.id);
  };
  const newRun = () => {
    setDiseases([]); setComorbidities([]); setPmcQuery(''); setAdvancedQuery(false);
    setPubTypes({ case_reports: true }); setPmcResults(null); setExcluded({});
    setResults(null); setOutputFiles([]); setConfigReady(false); setArticlesCount(0);
    setLogs([]); setMeter({ phase: '', cur: 0, total: 0, eta: null });
    setActiveStep(1); setActiveTab('results'); setActiveRunId(null); setStatus('idle');
  };
  const loadRun = (run) => {
    setActiveRunId(run.id); setDiseases(run.diseases || []);
  };
  const deleteRun = (id, e) => { e.stopPropagation(); setRuns(prev => { const next = prev.filter(r => r.id !== id); saveRuns(next); return next; }); if (activeRunId === id) setActiveRunId(null); };

  const loadCorrections = async () => {
    const d = await api('/api/corrections');
    setCorrections((d && d.corrections) || []);
  };

  const StepNode = ({ n }) => {
    const cls = stepDone[n] ? 'done' : (activeStep === n ? 'active' : (stepLocked[n] ? 'locked' : ''));
    return cls;
  };
  const llmBlocked = enableLLM && !llmApiKey;
  const canRun = configReady && articlesCount > 0 && !llmBlocked;

  const stepClass = (n) => {
    if (stepDone[n] && activeStep !== n) return 'step done';
    if (activeStep === n) return 'step active' + (stepDone[n] ? ' done' : '');
    if (stepLocked[n]) return 'step locked';
    return 'step';
  };

  return (
    <div className="app">
      {/* Topbar */}
      <div className="topbar">
        <div className="brand-mark"><span className="brand-dot"></span></div>
        <div className="titles">
          <h1>Phenotype Mining Console</h1>
          <span className="sub">Literature phenotyping from PubMed Central case reports</span>
        </div>
        <div className="topbar-right">
          {isRunning && (
            <div className="global-progress">
              <div className="gp-meta">
                <span>{meter.phase || 'Working'}</span>
                <span>{meter.total ? `${meter.cur}/${meter.total}` : ''}</span>
              </div>
              <div className="gp-track">
                <div className={'gp-fill' + (meter.total ? '' : ' indet')} style={{ width: meter.total ? `${Math.min(100, meter.cur/meter.total*100)}%` : undefined }}></div>
              </div>
            </div>
          )}
          <span className={'status-pill sp-' + status}>
            <span className="ico"></span>
            {status === 'running' ? (progress || 'Running') : status === 'done' ? 'Complete' : status === 'error' ? 'Error' : 'Ready'}
          </span>
        </div>
      </div>

      {/* Runs rail */}
      <div className="runs-rail">
        <div className="rail-head">
          <span className="lbl">Runs</span>
          <button className="new-run-btn" onClick={newRun}>＋ New</button>
        </div>
        <div className="runs-list">
          {runs.length === 0 && <div className="rail-empty">No runs yet.<br/>Configure diseases and run the pipeline to save a run here.</div>}
          {runs.map(run => (
            <div key={run.id} className={'run-card' + (activeRunId === run.id ? ' active' : '')} onClick={() => loadRun(run)}>
              <button className="rc-del" onClick={(e) => deleteRun(run.id, e)} title="Delete run">×</button>
              <div className="rc-title">{run.title}</div>
              <div className="rc-meta">{new Date(run.ts).toLocaleDateString(undefined, { month: 'short', day: 'numeric' })} · {new Date(run.ts).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' })}</div>
              <div className="rc-stat"><span>📄 {run.corpus} corpus</span><span>✓ {run.extracted} extracted</span></div>
            </div>
          ))}
        </div>
      </div>

      {/* Control column */}
      <div className="control-col">
        <div className="stepper">

          {/* Step 1 */}
          <div className={stepClass(1)}>
            <div className="rail-line"></div>
            <div className="node">{stepDone[1] ? '✓' : '1'}</div>
            <div className="step-card">
              <div className="step-header" onClick={() => goStep(1)}>
                <span className="st-title">Define conditions</span>
                {stepDone[1] && activeStep !== 1 && <span className="st-sum">{diseases.length} disease{diseases.length!==1?'s':''}</span>}
                <span className="chev">▸</span>
              </div>
              <div className={'step-body' + (activeStep === 1 ? '' : ' collapsed')}>

                    <button key={p.label} className="preset" disabled={isRunning} onClick={() => { setDiseases(p.diseases); setAdvancedQuery(false); }}>{p.label}</button>

                <button className="btn primary" onClick={generateConfig} disabled={isRunning || !diseases.length}>

                </button>
                {meter.phase === 'Resolving ontology' && isRunning && <ProgressMeter meter={meter} />}
              </div>
            </div>
          </div>

          {/* Step 2 */}
          <div className={stepClass(2)}>
            <div className="rail-line"></div>
            <div className="node">{stepDone[2] ? '✓' : '2'}</div>
            <div className="step-card">

                <span className="st-title">Search the literature</span>

                <span className="chev">▸</span>
              </div>
              <div className={'step-body' + (activeStep === 2 ? '' : ' collapsed')}>
                <div className="field">
                  <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                    <label className="field-label" style={{ marginBottom: 0 }}>Query</label>
                    <label className="cbx" style={{ fontSize: 11 }}><input type="checkbox" checked={advancedQuery} onChange={e => setAdvancedQuery(e.target.checked)} disabled={isRunning} /> Edit raw</label>
                  </div>
                  {advancedQuery ? (
                    <textarea value={pmcQuery} onChange={e => setPmcQuery(e.target.value)} rows={4} disabled={isRunning} style={{ marginTop: 5 }} />
                  ) : (
                    <div style={{ marginTop: 5 }}>
                      <div className="chip-input" style={{ cursor: 'default', flexWrap: 'wrap' }}>
                        {diseases.length === 0 && <span style={{ color: 'var(--ink-3)', fontSize: 12 }}>Add diseases in step 1 to build a query</span>}
                        {diseases.map((d,i) => <span key={i} className="chip"><span className="ct">{d}</span></span>)}
                        {Object.keys(pubTypes).filter(k=>pubTypes[k]).map(k => <span key={k} className="chip comorb"><span className="ct">{PUB_TYPE_OPTIONS.find(o=>o.id===k)?.label}</span></span>)}
                      </div>

                  <label className="field-label">Restrict to publication types</label>
                  <div className="checkbox-grid">
                    {PUB_TYPE_OPTIONS.map(opt => (
                      <label key={opt.id} className={'cbx' + (isRunning ? ' disabled' : '')}>
                        <input type="checkbox" checked={!!pubTypes[opt.id]} disabled={isRunning} onChange={() => setPubTypes(p => ({ ...p, [opt.id]: !p[opt.id] }))} />
                        {opt.label}
                      </label>
                    ))}
                  </div>
                  <div className="hint">None ticked = every type. Extraction still targets individual case reports.</div>
                </div>

                  <label className="field-label">Max results to retrieve</label>
                  <div className="slider-row">

                    <input type="number" className="count-input" min={0} value={maxArticles} disabled={isRunning || maxArticles === 0} onChange={e => setMaxArticles(Math.max(0, parseInt(e.target.value) || 0))} />

                    <input type="checkbox" checked={maxArticles === 0} disabled={isRunning} onChange={e => setMaxArticles(e.target.checked ? 0 : 200)} />

                  </label>
                  <div className="hint">Drag, type an exact number, or tick to pull <b>every</b> open-access match (it stops at the number actually found). Big corpora map &amp; download slowly — ~3 articles/sec under NCBI's rate limit.</div>

                <button className="btn primary" onClick={searchPMC} disabled={isRunning || !pmcQuery.trim()}>Search PubMed Central</button>

                {pmcResults && pmcResults.total > 0 && (
                  <div className="search-summary">
                    <div className="ss-head">✓ {pmcResults.total.toLocaleString()} articles found <span className="ss-sub">{pmcResults.downloadable} retrievable · {pmcResults.results.length} previewed</span></div>
                  </div>

          </div>

          {/* Step 3 */}
          <div className={stepClass(3)}>

            <div className="node">{stepDone[3] ? '✓' : '3'}</div>
            <div className="step-card">
              <div className="step-header" onClick={() => goStep(3)}>
                <span className="st-title">Fetch full text</span>
                {stepLocked[3] && <span className="st-sum">Locked</span>}
                {stepDone[3] && activeStep !== 3 && <span className="st-sum">{articlesCount} downloaded</span>}
                <span className="chev">▸</span>

              <div className={'step-body' + (activeStep === 3 ? '' : ' collapsed')}>

                    <input type="number" className="count-input" min={0} value={maxDownload} disabled={isRunning || maxDownload === 0} onChange={e => setMaxDownload(Math.max(0, parseInt(e.target.value) || 0))} />
                  </div>
                  <label className="cbx" style={{ marginTop: 7 }}>
                    <input type="checkbox" checked={maxDownload === 0} disabled={isRunning} onChange={e => setMaxDownload(e.target.checked ? 0 : 50)} />
